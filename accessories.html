<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Accessories</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    color: #222;
}

/* HEADER */

header {
    background: #333;
    color: white;
    padding: 15px;
}

.header {
    max-width: 1050px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.account {
    background: #222;
    padding: 8px 12px;
    border-radius: 5px;
}

/* NAVIGATION */

nav {
    background: #444;
    overflow-x: auto;
    white-space: nowrap;
}

nav a {
    display: inline-block;

    color: white;
    text-decoration: none;

    padding: 13px 15px;
}

nav a:hover {
    background: #222;
}

/* PAGE */

.container {
    max-width: 1050px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-top: 0;
}

/* SEARCH */

.search {
    width: 100%;

    padding: 13px;

    border: 1px solid #aaa;
    border-radius: 5px;

    font-size: 16px;

    margin-bottom: 15px;
}

/* CATEGORIES */

.categories {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    padding-bottom: 15px;
}

.categories button {
    background: white;

    border: 1px solid #aaa;

    border-radius: 5px;

    padding: 10px 15px;

    white-space: nowrap;

    cursor: pointer;
}

.categories button.active {
    background: #333;
    color: white;
}

/* ITEM GRID */

.items {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));

    gap: 15px;
}

/* ITEM */

.item {
    background: white;

    border: 1px solid #ccc;

    border-radius: 7px;

    padding: 12px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.08);
}

/* PREVIEW */

.preview {
    height: 160px;

    background:
        linear-gradient(
            135deg,
            #ddd,
            #f5f5f5
        );

    border-radius: 5px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 10px;
}

.icon {
    font-size: 70px;
}

.item h3 {
    margin: 5px 0;
}

.type {
    color: #777;
    font-size: 13px;
}

.free {
    color: #159447;
    font-weight: bold;
}

/* BUTTONS */

.item button {
    width: 100%;

    padding: 10px;

    margin-top: 7px;

    border: 0;

    border-radius: 5px;

    background: #1683ff;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.item button:hover {
    background: #006bd6;
}

.favorite {
    background: #eee !important;
    color: #222 !important;
}

/* INVENTORY */

.inventory {
    margin-top: 30px;

    background: white;

    padding: 15px;

    border: 1px solid #ccc;

    border-radius: 7px;
}

.inventory-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 10px;

    border-bottom: 1px solid #ddd;
}

.inventory-item:last-child {
    border-bottom: none;
}

.inventory button {
    background: #333;

    color: white;

    border: 0;

    padding: 7px 12px;

    border-radius: 4px;
}

/* NOT LOGGED IN */

.login-box {
    background: white;

    border: 1px solid #ccc;

    padding: 20px;

    border-radius: 7px;

    text-align: center;
}

.login-box a {
    display: inline-block;

    margin-top: 10px;

    padding: 10px 18px;

    background: #1683ff;

    color: white;

    text-decoration: none;

    border-radius: 5px;
}

/* MOBILE */

@media (max-width: 500px) {

    .header {
        flex-direction: column;
    }

    .items {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .item {
        padding: 8px;
    }

    .preview {
        height: 120px;
    }

    .icon {
        font-size: 50px;
    }

    .item h3 {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<header>

    <div class="header">

        <div class="logo">
            MTB REVIVALS
        </div>

        <div class="account">

            👤

            <span id="username">
                Guest
            </span>

            |

            💰

            <span id="coins">
                0
            </span>

        </div>

    </div>

</header>


<nav>

    <a href="index.html">
        Home
    </a>

    <a href="login.html">
        Account
    </a>

    <a href="avatar.html">
        Avatar
    </a>

    <a href="accessories.html">
        Accessories
    </a>

    <a href="clothes.html">
        Clothes
    </a>

    <a href="inventory.html">
        Inventory
    </a>

    <a href="games.html">
        Games
    </a>

    <a href="news.html">
        News
    </a>

</nav>


<div class="container">


<h1>
    🎩 Accessories
</h1>

<p>
    All MTB REVIVALS accessories are FREE!
</p>


<!-- LOGIN WARNING -->

<div
    id="loginWarning"
    class="login-box"
    style="display:none;"
>

    <h2>
        🔐 Login Required
    </h2>

    <p>
        Login or create an account to collect
        accessories.
    </p>

    <a href="login.html">
        Login / Sign Up
    </a>

</div>


<!-- CATALOG -->

<div id="catalog">


<input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Search accessories..."
>


<div class="categories">

    <button
        class="active"
        onclick="filterItems('All', this)"
    >
        All
    </button>

    <button
        onclick="filterItems('Hat', this)"
    >
        Hats
    </button>

    <button
        onclick="filterItems('Special', this)"
    >
        Special
    </button>

    <button
        onclick="filterItems('Back', this)"
    >
        Back
    </button>

    <button
        onclick="filterItems('Face', this)"
    >
        Faces
    </button>

</div>


<div
    id="items"
    class="items"
></div>


<!-- INVENTORY -->

<div class="inventory">

    <h2>
        📦 My Accessories
    </h2>

    <div id="inventory">
        <p>
            You don't own any accessories yet.
        </p>
    </div>

</div>


</div>

</div>


<script>

/*
==================================================
MTB REVIVALS ACCESSORY SYSTEM
==================================================

All items in this demo are ORIGINAL placeholder
concepts.

Replace the emoji previews with artwork/models
that you created or have permission to use.

==================================================
*/


/* ACCESSORIES */

const items = [

    {
        id: 101,
        name: "Frozen Horns",
        type: "Special",
        icon: "❄️",
        description:
            "Mystical frozen horns."
    },

    {
        id: 102,
        name: "Shadowless Head",
        type: "Special",
        icon: "💀",
        description:
            "A mysterious headless-style avatar effect."
    },

    {
        id: 103,
        name: "Void Walker Leg",
        type: "Special",
        icon: "🦵",
        description:
            "A dark legendary leg accessory."
    },

    {
        id: 104,
        name: "Classic Crown",
        type: "Hat",
        icon: "👑",
        description:
            "A simple classic crown."
    },

    {
        id: 105,
        name: "Classic Fedora",
        type: "Hat",
        icon: "🎩",
        description:
            "A classic-style fedora."
    },

    {
        id: 106,
        name: "Golden Wings",
        type: "Back",
        icon: "🪽",
        description:
            "Golden wings for your avatar."
    },

    {
        id: 107,
        name: "Classic Smile",
        type: "Face",
        icon: "🙂",
        description:
            "A classic happy face."
    },

    {
        id: 108,
        name: "Blue Headphones",
        type: "Hat",
        icon: "🎧",
        description:
            "Classic blue headphones."
    },

    {
        id: 109,
        name: "Ice Backpack",
        type: "Back",
        icon: "🎒",
        description:
            "A frozen backpack."
    }

];


/* CURRENT USER */

let username =
    localStorage.getItem(
        "mtbLoggedIn"
    );


/* GET ACCOUNTS */

function getAccounts() {

    return JSON.parse(
        localStorage.getItem(
            "mtbAccounts"
        )
    ) || {};

}


/* SAVE ACCOUNTS */

function saveAccounts(accounts) {

    localStorage.setItem(
        "mtbAccounts",
        JSON.stringify(accounts)
    );

}


/* CHECK LOGIN */

if (!username) {

    document.getElementById(
        "catalog"
    ).style.display = "none";

    document.getElementById(
        "loginWarning"
    ).style.display = "block";

} else {

    loadUser();

}


/* LOAD USER */

function loadUser() {

    const accounts =
        getAccounts();

    const account =
        accounts[username];


    if (!account) {

        localStorage.removeItem(
            "mtbLoggedIn"
        );

        location.reload();

        return;

    }


    /* DISPLAY USERNAME */

    document.getElementById(
        "username"
    ).textContent =
        account.username;


    /* DISPLAY COINS */

    document.getElementById(
        "coins"
    ).textContent =
        account.coins;


    /* MAKE SURE INVENTORY EXISTS */

    if (!account.inventory) {

        account.inventory = [];

    }


    if (!account.favorites) {

        account.favorites = [];

    }


    saveAccounts(accounts);


    displayItems();

    displayInventory();

}


/* CATEGORY */

let currentCategory = "All";


function filterItems(
    category,
    button
) {

    currentCategory =
        category;


    document
        .querySelectorAll(
            ".categories button"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    displayItems();

}


/* DISPLAY */

function displayItems() {

    const container =
        document.getElementById(
            "items"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase();


    const accounts =
        getAccounts();


    const account =
        accounts[username];


    container.innerHTML = "";


    const filtered =
        items.filter(item => {

            const categoryMatch =
                currentCategory === "All" ||
                item.type === currentCategory;


            const searchMatch =
                item.name
                    .toLowerCase()
                    .includes(search);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    filtered.forEach(item => {


        const owned =
            account.inventory
                .includes(item.id);


        const favorite =
            account.favorites
                .includes(item.id);


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "item";


        div.innerHTML = `

            <div class="preview">

                <div class="icon">
                    ${item.icon}
                </div>

            </div>

            <h3>
                ${item.name}
            </h3>

            <div class="type">
                ${item.type}
            </div>

            <p>
                ${item.description}
            </p>

            <p class="free">
                FREE
            </p>

            <button
                onclick="claimItem(${item.id})"
                ${owned ? "disabled" : ""}
            >

                ${
                    owned
                    ? "✓ Owned"
                    : "🎁 Get Item"
                }

            </button>

            <button
                class="${
                    favorite
                    ? "favorite"
                    : ""
                }"

                onclick="
                    toggleFavorite(
                        ${item.id}
                    )
                "
            >

                ${
                    favorite
                    ? "★ Favorited"
                    : "☆ Favorite"
                }

            </button>

        `;


        container.appendChild(
            div
        );

    });

}


/* CLAIM */

function claimItem(id) {

    const accounts =
        getAccounts();


    const account =
        accounts[username];


    if (!account) {

        alert(
            "Please login first."
        );

        return;

    }


    if (
        account.inventory
            .includes(id)
    ) {

        alert(
            "You already own this item!"
        );

        return;

    }


    account.inventory.push(
        id
    );


    saveAccounts(
        accounts
    );


    const item =
        items.find(
            i => i.id === id
        );


    alert(
        item.name +
        " was added to your inventory!"
    );


    displayItems();

    displayInventory();

}


/* FAVORITE */

function toggleFavorite(id) {

    const accounts =
        getAccounts();


    const account =
        accounts[username];


    if (!account) return;


    if (
        account.favorites
            .includes(id)
    ) {

        account.favorites =
            account.favorites.filter(
                itemId =>
                    itemId !== id
            );

    } else {

        account.favorites.push(
            id
        );

    }


    saveAccounts(
        accounts
    );


    displayItems();

}


/* INVENTORY */

function displayInventory() {

    const container =
        document.getElementById(
            "inventory"
        );


    const accounts =
        getAccounts();


    const account =
        accounts[username];


    container.innerHTML = "";


    if (
        !account ||
        account.inventory.length === 0
    ) {

        container.innerHTML =
            "<p>You don't own any accessories yet.</p>";

        return;

    }


    account.inventory.forEach(
        id => {

            const item =
                items.find(
                    i => i.id === id
                );


            if (!item) return;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "inventory-item";


            row.innerHTML = `

                <span>
                    ${item.icon}
                    ${item.name}
                </span>

                <button
                    onclick="
                        equipItem(
                            ${item.id}
                        )
                    "
                >
                    Equip
                </button>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* EQUIP */

function equipItem(id) {

    localStorage.setItem(
        "mtbEquippedItem",
        id
    );


    const item =
        items.find(
            i => i.id === id
        );


    alert(
        item.name +
        " equipped!"
    );

}


/* SEARCH */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        displayItems
    );

</script>

</body>

</html>
