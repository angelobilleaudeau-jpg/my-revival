    </nav>

</header>

<div class="container">

    <!-- LOGIN -->

    <div class="box" id="loginBox">

        <h1>Login</h1>

        <p style="text-align:center;">
            Log in to your MTB REVIVALS account.
        </p>

        <label>Username</label>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="login()">
            LOGIN
        </button>

        <div class="message" id="loginMessage"></div>

    </div>


    <!-- CREATE ACCOUNT -->

    <div class="box" id="registerBox">

        <h2>Create Account</h2>

        <input
            type="text"
            id="registerUsername"
            placeholder="Choose a username"
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Choose a password"
        >

        <button onclick="register()">
            CREATE ACCOUNT
        </button>

        <div class="message" id="registerMessage"></div>

    </div>


    <!-- ACCOUNT -->

    <div class="box account" id="accountBox">

        <h1>My Account</h1>

        <div class="avatar">
            👤
        </div>

        <h2 id="accountUsername"></h2>

        <p>
            Welcome to MTB REVIVALS!
        </p>

        <button class="logout" onclick="logout()">
            LOG OUT
        </button>

    </div>

</div>

<footer>
    © 2026 MTB REVIVALS
</footer>


<script>

    /*
        MTB REVIVALS BASIC ACCOUNT SYSTEM

        IMPORTANT:
        This is a browser-only demo.

        Accounts are stored in localStorage.
        This is NOT secure enough for a real public website.
    */


    function register() {

        let username =
            document.getElementById("registerUsername")
            .value
            .trim();

        let password =
            document.getElementById("registerPassword")
            .value;

        let message =
            document.getElementById("registerMessage");


        if (username.length < 3) {

            message.textContent =
                "Username must be at least 3 characters.";

            return;
        }


        if (password.length < 4) {

            message.textContent =
                "Password must be at least 4 characters.";

            return;
        }


        let account = {

            username: username,
            password: password

        };


        localStorage.setItem(
            "mtbAccount",
            JSON.stringify(account)
        );


        localStorage.setItem(
            "mtbLoggedIn",
            "true"
        );


        message.textContent =
            "Account created!";


        showAccount();
    }



    function login() {

        let username =
            document.getElementById("loginUsername")
            .value
            .trim();

        let password =
            document.getElementById("loginPassword")
            .value;

        let message =
            document.getElementById("loginMessage");


        let savedAccount =
            localStorage.getItem("mtbAccount");


        if (!savedAccount) {

            message.textContent =
                "No account exists yet.";

            return;
        }


        let account =
            JSON.parse(savedAccount);


        if (
            username === account.username &&
            password === account.password
        ) {

            localStorage.setItem(
                "mtbLoggedIn",
                "true"
            );

            message.textContent =
                "Login successful!";

            showAccount();

        } else {

            message.textContent =
                "Incorrect username or password.";

        }

    }



    function logout() {

        localStorage.setItem(
            "mtbLoggedIn",
            "false"
        );

        document.getElementById("accountBox")
            .style.display = "none";

        document.getElementById("loginBox")
            .style.display = "block";

        document.getElementById("registerBox")
            .style.display = "block";

    }



    function showAccount() {

        let savedAccount =
            localStorage.getItem("mtbAccount");

        if (!savedAccount) {
            return;
        }


        let account =
            JSON.parse(savedAccount);


        document.getElementById("accountUsername")
            .textContent =
            account.username;


        document.getElementById("loginBox")
            .style.display = "none";

        document.getElementById("registerBox")
            .style.display = "none";

        document.getElementById("accountBox")
            .style.display = "block";

    }



    function checkLogin() {

        let loggedIn =
            localStorage.getItem("mtbLoggedIn");


        if (loggedIn === "true") {

            showAccount();

        }

    }


    checkLogin();

</script>

</body>
