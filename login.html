<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Account</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    background: #e8e8e8;
    color: #333;
}

/* HEADER */

header {
    background: linear-gradient(#f7f7f7, #d1d1d1);
    border-bottom: 1px solid #999;
    box-shadow: 0 1px 3px #aaa;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 8px 10px 0;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #333;
    padding: 5px 0 10px;
}

nav {
    display: flex;
    flex-wrap: wrap;
}

nav a {
    display: block;
    padding: 9px 13px;
    color: #444;
    text-decoration: none;
    border: 1px solid transparent;
    border-bottom: 0;
}

nav a:hover {
    background: #ddd;
}

nav a.active {
    background: white;
    border: 1px solid #aaa;
    border-bottom: 1px solid white;
    color: #1683c5;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 10px;
}

.page-title {
    background: linear-gradient(#666, #444);
    color: white;
    padding: 9px 12px;
    border: 1px solid #333;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px #222;
}

/* ACCOUNT */

.account-area {
    max-width: 500px;
    margin: 25px auto;
}

.account-box {
    background: white;
    border: 1px solid #aaa;
    box-shadow: 0 1px 3px #ccc;
}

.box-header {
    background: linear-gradient(#f5f5f5, #d5d5d5);
    border-bottom: 1px solid #aaa;
    padding: 10px;
    font-size: 16px;
    font-weight: bold;
}

.box-content {
    padding: 20px;
}

/* TABS */

.tabs {
    display: flex;
    border-bottom: 1px solid #aaa;
    margin-bottom: 18px;
}

.tab {
    flex: 1;
    padding: 10px;
    border: 0;
    border-radius: 0;
    background: #ddd;
    color: #444;
    text-shadow: none;
}

.tab.active {
    background: #1683c5;
    color: white;
}

/* FORMS */

.form-group {
    margin-bottom: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

input {
    width: 100%;
    height: 36px;
    border: 1px solid #999;
    padding: 8px;
    font-family: Arial;
    font-size: 13px;
}

input:focus {
    outline: none;
    border-color: #1683c5;
}

/* BUTTON */

.main-button {
    width: 100%;
    border: 1px solid #555;
    border-radius: 3px;
    background: linear-gradient(#65b5e8, #1683c5);
    color: white;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px #555;
}

.main-button:hover {
    background: linear-gradient(#79c5ed, #1683c5);
}

/* MESSAGE */

.message {
    display: none;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #aaa;
    background: #f5f5f5;
    font-weight: bold;
}

.message.success {
    color: #258425;
}

.message.error {
    color: #b52b2b;
}

/* ACCOUNT INFO */

.account-info {
    display: none;
}

.profile {
    text-align: center;
    padding: 15px;
}

.avatar-icon {
    width: 80px;
    height: 80px;
    margin: auto;
    background: #1683ff;
    border: 3px solid #555;
    position: relative;
}

.avatar-icon:before {
    content: "";
    position: absolute;
    width: 42px;
    height: 42px;
    left: 16px;
    top: -47px;
    background: #f2c29b;
    border: 3px solid #555;
}

.username {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

.status {
    color: #777;
    margin-top: 5px;
}

.account-buttons {
    margin-top: 20px;
}

.account-buttons button {
    margin-top: 8px;
}

.logout {
    background: linear-gradient(#e57373, #b52b2b) !important;
}

/* FOOTER */

footer {
    max-width: 1000px;
    margin: 50px auto 0;
    padding: 15px 10px;
    border-top: 1px solid #aaa;
    color: #777;
}

footer a {
    color: #1683c5;
    text-decoration: none;
}

/* MOBILE */

@media (max-width: 500px) {

    .logo {
        text-align: center;
    }

    nav a {
        padding: 8px 9px;
        font-size: 12px;
    }

    .box-content {
        padding: 15px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="header-inner">

        <div class="logo">
            MTB REVIVALS
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html" class="active">
                Account
            </a>

            <a href="avatar.html">
                Avatar
            </a>

            <a href="accessories.html">
                Accessories
            </a>

            <a href="clothes.html">
                Clothes
            </a>

            <a href="inventory.html">
                Inventory
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="news.html">
                News
            </a>

        </nav>

    </div>

</header>


<!-- MAIN -->

<div class="container">

    <div class="page-title">
        Account
    </div>


    <div class="account-area">


        <!-- LOGIN / REGISTER -->

        <div
            class="account-box"
            id="authBox">

            <div class="box-header">
                MTB REVIVALS Account
            </div>

            <div class="box-content">


                <!-- TABS -->

                <div class="tabs">

                    <button
                        id="loginTab"
                        class="tab active"
                        onclick="showLogin()">

                        Login

                    </button>

                    <button
                        id="registerTab"
                        class="tab"
                        onclick="showRegister()">

                        Register

                    </button>

                </div>


                <div
                    id="message"
                    class="message">
                </div>


                <!-- LOGIN FORM -->

                <form
                    id="loginForm"
                    onsubmit="login(event)">

                    <div class="form-group">

                        <label>
                            Username
                        </label>

                        <input
                            id="loginUsername"
                            type="text"
                            maxlength="20"
                            required
                            autocomplete="username"
                            placeholder="Enter username">

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            id="loginPassword"
                            type="password"
                            required
                            autocomplete="current-password"
                            placeholder="Enter password">

                    </div>


                    <button
                        class="main-button"
                        type="submit">

                        Login

                    </button>

                </form>


                <!-- REGISTER FORM -->

                <form
                    id="registerForm"
                    style="display:none;"
                    onsubmit="register(event)">

                    <div class="form-group">

                        <label>
                            Username
                        </label>

                        <input
                            id="registerUsername"
                            type="text"
                            maxlength="20"
                            required
                            autocomplete="username"
                            placeholder="Choose a username">

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            id="registerPassword"
                            type="password"
                            minlength="4"
                            required
                            autocomplete="new-password"
                            placeholder="Choose a password">

                    </div>


                    <div class="form-group">

                        <label>
                            Confirm Password
                        </label>

                        <input
                            id="confirmPassword"
                            type="password"
                            minlength="4"
                            required
                            autocomplete="new-password"
                            placeholder="Enter password again">

                    </div>


                    <button
                        class="main-button"
                        type="submit">

                        Create Account

                    </button>

                </form>

            </div>

        </div>


        <!-- ACCOUNT INFO -->

        <div
            class="account-box account-info"
            id="accountInfo">

            <div class="box-header">
                My Account
            </div>

            <div class="box-content">

                <div class="profile">

                    <div class="avatar-icon"></div>

                    <div
                        class="username"
                        id="profileUsername">
                    </div>

                    <div class="status">
                        Member of MTB REVIVALS
                    </div>

                    <button
                        class="main-button"
                        onclick="location.href='avatar.html'">

                        View Avatar

                    </button>


                    <button
                        class="main-button"

                        My Inventory

                    </button>


                    <button
                        class="main-button"
                        onclick="location.href='clothes.html'">

                        Browse Clothes

                    </button>


                    <button
                        class="main-button logout"
                        onclick="logout()">

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

    </a>

    &nbsp; | &nbsp;

    <a href="news.html">
        News
    </a>

</footer>


<script>

/*
    MTB REVIVALS ACCOUNT SYSTEM

    IMPORTANT:

    This is a browser-only demo account system.

    Accounts are stored in localStorage.
    It is NOT secure enough for a real production website.

    A real website should use a server/database
    and hashed passwords.
*/


/* GET ACCOUNTS */

function getAccounts() {

    return JSON.parse(
        localStorage.getItem("mtbAccounts")
    ) || [];

}


/* SAVE ACCOUNTS */

function saveAccounts(accounts) {

    localStorage.setItem(
        "mtbAccounts",
        JSON.stringify(accounts)
    );

}


/* SHOW LOGIN */

function showLogin() {

    document
        .getElementById("loginForm")
        .style.display = "block";

    document
        .getElementById("registerForm")
        .style.display = "none";


    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");


    clearMessage();

}


/* SHOW REGISTER */

function showRegister() {

    document
        .getElementById("loginForm")
        .style.display = "none";

    document
        .getElementById("registerForm")
        .style.display = "block";


    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.add("active");


    clearMessage();

}


/* REGISTER */

function register(event) {

    event.preventDefault();


    const username =
        document
        .getElementById("registerUsername")
        .value
        .trim();


    const password =
        document
        .getElementById("registerPassword")
        .value;


    const confirm =
        document
        .getElementById("confirmPassword")
        .value;


    if (username.length < 3) {

        showMessage(
            "Username must be at least 3 characters.",
            "error"
        );

        return;

    }


    if (password.length < 4) {

        showMessage(
            "Password must be at least 4 characters.",
            "error"
        );

        return;

    }


    if (password !== confirm) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;

    }


    const accounts =
        getAccounts();


    const exists =
        accounts.some(function(account) {

            return account.username.toLowerCase()
                === username.toLowerCase();

        });


    if (exists) {

        showMessage(
            "That username is already taken.",
            "error"
        );

        return;

    }


    /*
        Create account.

        This demo stores the password locally.
        Do not use this method for real passwords.
    */

    accounts.push({

        username: username,
        password: password,
        created: new Date().toISOString()

    });


    saveAccounts(accounts);


    /*
        Automatically log the player in.
    */

    localStorage.setItem(
        "mtbCurrentUser",
        username
    );


    showMessage(
        "Account created successfully!",
        "success"
    );


    setTimeout(function() {

        showAccount();

    }, 700);

}


/* LOGIN */

function login(event) {

    event.preventDefault();


    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const accounts =
        getAccounts();


    const account =
        accounts.find(function(account) {

            return (
                account.username.toLowerCase()
                === username.toLowerCase()
                &&
                account.password === password
            );

        });


    if (!account) {

        showMessage(
            "Invalid username or password.",
            "error"
        );

        return;

    }


    localStorage.setItem(
        "mtbCurrentUser",
        account.username
    );


    showMessage(
        "Login successful!",
        "success"
    );


    setTimeout(function() {

        showAccount();

    }, 500);

}


/* SHOW ACCOUNT */

function showAccount() {

    const currentUser =
        localStorage.getItem(
            "mtbCurrentUser"
        );


    if (!currentUser) {

        document
            .getElementById("authBox")
            .style.display = "block";

        document
            .getElementById("accountInfo")
            .style.display = "none";

        return;

    }


    document
        .getElementById("authBox")
        .style.display = "none";


    document
        .getElementById("accountInfo")
        .style.display = "block";


    document
        .getElementById("profileUsername")
        .textContent = currentUser;

}


/* LOGOUT */

function logout() {

    localStorage.removeItem(
        "mtbCurrentUser"
    );


    document
        .getElementById("accountInfo")
        .style.display = "none";


    document
        .getElementById("authBox")
        .style.display = "block";


    showLogin();


    showMessage(
        "You have been logged out.",
        "success"
    );

}


/* MESSAGE */

function showMessage(text, type) {

    const message =
        document.getElementById("message");


    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}


/* CLEAR MESSAGE */

function clearMessage() {

    const message =
        document.getElementById("message");

    message.style.display = "none";

}


/* START */

showAccount();

</script>

</body>

</html>
