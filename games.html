<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Games</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    color: #222;
}

/* HEADER */

header {
    background: #333;
    color: white;
    padding: 15px;
}

.header {
    max-width: 1100px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.user {
    background: #222;
    padding: 8px 12px;
    border-radius: 5px;
}

/* NAVIGATION */

nav {
    background: #444;
    width: 100%;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

nav a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 13px 15px;
    text-align: center;
    flex: 0 0 auto;
}

nav a:hover {
    background: #222;
}

/* MOBILE */

@media (max-width: 600px) {
    nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        width: 100%;
    }

    nav a {
        width: 100%;
        padding: 12px 5px;
        font-size: 14px;
        border-bottom: 1px solid #555;
    }
}
