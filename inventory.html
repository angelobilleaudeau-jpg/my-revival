```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Inventory</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    background: #e8e8e8;
    color: #333;
}

/* HEADER */

header {
    background: linear-gradient(#f7f7f7, #d1d1d1);
    border-bottom: 1px solid #999;
    box-shadow: 0 1px 3px #aaa;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 8px 10px 0;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #333;
    padding: 5px 0 10px;
}

/* NAV */

nav {
    display: flex;
    flex-wrap: wrap;
}

nav a {
    display: block;
    padding: 9px 13px;
    color: #444;
    text-decoration: none;
    border: 1px solid transparent;
    border-bottom: 0;
}

nav a:hover {
    background: #ddd;
}

nav a.active {
    background: white;
    border: 1px solid #aaa;
    border-bottom: 1px solid white;
    color: #1683c5;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 10px;
}

/* TITLE */

.page-title {
    background: linear-gradient(#666, #444);
    color: white;
    padding: 9px 12px;
    border: 1px solid #333;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px #222;
}

/* TOOLBAR */

.toolbar {
    background: white;
    border: 1px solid #aaa;
    padding: 10px;
    margin-top: 15px;
}

.search-row {
    display: flex;
    gap: 7px;
}

.search {
    flex: 1;
    height: 34px;
    border: 1px solid #999;
    padding: 7px;
    font-size: 13px;
}

button {
    border: 1px solid #555;
    border-radius: 3px;
    background: linear-gradient(#65b5e8, #1683c5);
    color: white;
    padding: 7px 14px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px #555;
}

button:hover {
    background: linear-gradient(#79c5ed, #1683c5);
}

button.gray {
    background: linear-gradient(#aaa, #777);
}

button.gray:hover {
    background: linear-gradient(#bbb, #888);
}

button.red {
    background: linear-gradient(#e57373, #b52b2b);
}

button.red:hover {
    background: linear-gradient(#ef8585, #c33b3b);
}

/* INVENTORY BOX */

.inventory-box {
    margin-top: 15px;
    background: white;
    border: 1px solid #aaa;
}

/* BOX TITLE */

.box-title {
    background: linear-gradient(#f5f5f5, #d7d7d7);
    border-bottom: 1px solid #aaa;
    padding: 9px;
    font-weight: bold;
    font-size: 15px;
}

/* ITEMS */

.inventory {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 12px;
}

.item {
    background: #f8f8f8;
    border: 1px solid #aaa;
    padding: 8px;
}

.item.equipped {
    border: 2px solid #1683c5;
}

.item-image {
    height: 140px;
    border: 1px solid #999;
    background: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* SHIRT */

.shirt {
    width: 90px;
    height: 105px;
    position: relative;
}

.shirt-body {
    position: absolute;
    width: 55px;
    height: 68px;
    left: 18px;
    top: 20px;
    border: 2px solid #555;
}

.sleeve {
    position: absolute;
    width: 20px;
    height: 50px;
    top: 25px;
    border: 2px solid #555;
}

.sleeve.left {
    left: 0;
    transform: rotate(15deg);
}

.sleeve.right {
    right: 0;
    transform: rotate(-15deg);
}

/* PANTS */

.pants {
    width: 70px;
    height: 105px;
    position: relative;
}

.pant {
    position: absolute;
    width: 31px;
    height: 90px;
    top: 5px;
    border: 2px solid #555;
}

.pant.left {
    left: 3px;
}

.pant.right {
    right: 3px;
}

/* ITEM TEXT */

.item h3 {
    color: #1683c5;
    font-size: 14px;
    margin: 9px 0 4px;
}

.item-type {
    color: #777;
    margin-bottom: 7px;
}

.item button {
    width: 100%;
    margin-top: 5px;
}

/* EQUIPPED LABEL */

.equipped-label {
    display: none;
    color: #1683c5;
    font-weight: bold;
    margin-bottom: 5px;
}

.item.equipped .equipped-label {
    display: block;
}

/* EMPTY */

.empty {
    padding: 40px;
    text-align: center;
    color: #777;
}

/* MESSAGE */

#message {
    display: none;
    background: white;
    border: 1px solid #aaa;
    padding: 10px;
    margin-top: 12px;
    color: #1683c5;
    font-weight: bold;
}

/* FOOTER */

footer {
    max-width: 1000px;
    margin: 40px auto 0;
    padding: 15px 10px;
    border-top: 1px solid #aaa;
    color: #777;
    font-size: 12px;
}

footer a {
    color: #1683c5;
    text-decoration: none;
}

/* MOBILE */

@media (max-width: 800px) {

    .inventory {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .logo {
        text-align: center;
    }

    nav a {
        padding: 8px 9px;
        font-size: 12px;
    }

    .inventory {
        grid-template-columns: 1fr;
    }

    .search-row {
        flex-direction: column;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="header-inner">

        <div class="logo">
            MTB REVIVALS
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Account
            </a>

            <a href="avatar.html">
                Avatar
            </a>

            <a href="accessories.html">
                Accessories
            </a>

            <a href="clothes.html">
                Clothes
            </a>

            <a href="inventory.html" class="active">
                Inventory
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="news.html">
                News
            </a>

        </nav>

    </div>

</header>


<!-- MAIN -->

<div class="container">


    <div class="page-title">
        My Inventory
    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <div class="search-row">

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Search your inventory..."
                onkeyup="searchInventory()"
            >

            <button onclick="searchInventory()">
                Search
            </button>

            <button
                class="gray"
                onclick="showAll()">

                Show All

            </button>

        </div>

    </div>


    <div id="message"></div>


    <!-- INVENTORY -->

    <div class="inventory-box">

        <div class="box-title">
            Items
        </div>

        <div
            class="inventory"
            id="inventory">

        </div>

        <div
            id="empty"
            class="empty"
            style="display:none;">

            Your inventory is empty.

            <br><br>

            <a href="clothes.html">
                Browse the catalog
            </a>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    MTB REVIVALS © 2026

    &nbsp; | &nbsp;

    <a href="index.html">
        Home
    </a>

    &nbsp; | &nbsp;

    <a href="clothes.html">
        Clothes
    </a>

    &nbsp; | &nbsp;

    <a href="avatar.html">
        Avatar
    </a>

</footer>


<script>

/*
    MTB REVIVALS INVENTORY

    Items come from clothes.html.

    Inventory is stored in localStorage.
*/


let inventory =
    JSON.parse(
        localStorage.getItem("mtbInventory")
    ) || [];


let equipped =
    JSON.parse(
        localStorage.getItem("mtbEquipped")
    ) || {

        Shirt: null,
        Pants: null,
        Accessory: null

    };


/* DISPLAY INVENTORY */

function displayInventory(items = inventory) {

    const container =
        document.getElementById("inventory");

    const empty =
        document.getElementById("empty");


    container.innerHTML = "";


    if (items.length === 0) {

        container.style.display = "none";
        empty.style.display = "block";

        return;

    }


    container.style.display = "grid";
    empty.style.display = "none";


    items.forEach(function(item, index) {

        const card =
            document.createElement("div");

        card.className = "item";


        /* Check equipped */

        if (
            equipped[item.type] === item.name
        ) {

            card.classList.add("equipped");

        }


        /* IMAGE */

        const image =
            document.createElement("div");

        image.className = "item-image";


        if (item.type === "Shirt") {

            image.innerHTML = `

                <div class="shirt">

                    <div
                        class="shirt-body"
                        style="background:#1683ff;">
                    </div>

                    <div
                        class="sleeve left"
                        style="background:#1683ff;">
                    </div>

                    <div
                        class="sleeve right"
                        style="background:#1683ff;">
                    </div>

                </div>

            `;

        }


        else if (item.type === "Pants") {

            image.innerHTML = `

                <div class="pants">

                    <div
                        class="pant left"
                        style="background:#333;">
                    </div>

                    <div
                        class="pant right"
                        style="background:#333;">
                    </div>

                </div>

            `;

        }


        else {

            image.textContent = "ITEM";

        }


        card.appendChild(image);


        /* NAME */

        const name =
            document.createElement("h3");

        name.textContent =
            item.name;

        card.appendChild(name);


        /* TYPE */

        const type =
            document.createElement("div");

        type.className =
            "item-type";

        type.textContent =
            item.type;

        card.appendChild(type);


        /* EQUIPPED */

        const label =
            document.createElement("div");

        label.className =
            "equipped-label";

        label.textContent =
            "✓ EQUIPPED";

        card.appendChild(label);


        /* EQUIP BUTTON */

        const equipButton =
            document.createElement("button");


        if (
            equipped[item.type] === item.name
        ) {

            equipButton.textContent =
                "Unequip";

            equipButton.className =
                "gray";

        } else {

            equipButton.textContent =
                "Equip";

        }


        equipButton.onclick =
            function() {

                toggleEquip(
                    item.name,
                    item.type
                );

            };


        card.appendChild(equipButton);


        /* DELETE BUTTON */

        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "Delete";

        deleteButton.className =
            "red";


        deleteButton.onclick =
            function() {

                deleteItem(index);

            };


        card.appendChild(deleteButton);


        container.appendChild(card);

    });

}


/* EQUIP / UNEQUIP */

function toggleEquip(name, type) {

    if (
        equipped[type] === name
    ) {

        equipped[type] = null;

        showMessage(
            name + " was unequipped."
        );

    } else {

        equipped[type] = name;

        showMessage(
            name + " equipped!"
        );

    }


    localStorage.setItem(
        "mtbEquipped",
        JSON.stringify(equipped)
    );


    displayInventory();

}


/* DELETE */

function deleteItem(index) {

    const item =
        inventory[index];


    if (!item) {
        return;
    }


    if (
        equipped[item.type] === item.name
    ) {

        equipped[item.type] = null;

        localStorage.setItem(
            "mtbEquipped",
            JSON.stringify(equipped)
        );

    }


    inventory.splice(index, 1);


    localStorage.setItem(
        "mtbInventory",
        JSON.stringify(inventory)
    );


    showMessage(
        item.name + " was removed."
    );


    displayInventory();

}


/* SEARCH */

function searchInventory() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        inventory.filter(function(item) {

            return item.name
                .toLowerCase()
                .includes(search);

        });


    displayInventory(filtered);

}


/* SHOW ALL */

function showAll() {

    document
        .getElementById("search")
        .value = "";

    displayInventory();

}


/* MESSAGE */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.style.display =
        "block";


    setTimeout(function() {

        message.style.display =
            "none";

    }, 2500);

}


/* START */

displayInventory();

</script>

</body>

</html>
