```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Inventory</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    background: #e8e8e8;
    color: #333;
}

/* HEADER */

header {
    background: linear-gradient(#f7f7f7, #d1d1d1);
    border-bottom: 1px solid #999;
    box-shadow: 0 1px 3px #aaa;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 8px 10px 0;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    padding: 5px 0 10px;
}

nav {
    display: flex;
    flex-wrap: wrap;
}

nav a {
    display: block;
    padding: 9px 13px;
    color: #444;
    text-decoration: none;
    border: 1px solid transparent;
    border-bottom: 0;
}

nav a:hover {
    background: #ddd;
}

nav a.active {
    background: white;
    border: 1px solid #aaa;
    border-bottom: 1px solid white;
    color: #1683c5;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 10px;
}

.page-title {
    background: linear-gradient(#666, #444);
    color: white;
    padding: 9px 12px;
    border: 1px solid #333;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px #222;
}

/* TOOLBAR */

.toolbar {
    margin-top: 15px;
    background: white;
    border: 1px solid #aaa;
    padding: 10px;
}

.toolbar button {
    margin-right: 5px;
}

/* BUTTONS */

button {
    border: 1px solid #555;
    border-radius: 3px;
    background: linear-gradient(#65b5e8, #1683c5);
    color: white;
    padding: 7px 13px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px #555;
}

button:hover {
    background: linear-gradient(#79c5ed, #1683c5);
}

button.gray {
    background: linear-gradient(#aaa, #777);
}

button.red {
    background: linear-gradient(#e57373, #b52b2b);
}

/* INVENTORY */

.inventory {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.item {
    background: white;
    border: 1px solid #aaa;
    padding: 8px;
    box-shadow: 0 1px 2px #ccc;
}

.item-preview {
    height: 135px;
    background: #eee;
    border: 1px solid #aaa;
    display: flex;
    align-items: center;
    justify-content: center;
}

.item-name {
    color: #1683c5;
    font-weight: bold;
    margin-top: 9px;
    font-size: 14px;
}

.item-type {
    color: #777;
    margin-top: 4px;
}

.item-buttons {
    margin-top: 9px;
}

.item-buttons button {
    width: 100%;
    margin-top: 5px;
}

/* ACCESSORY PREVIEW */

.mini-avatar {
    width: 90px;
    height: 110px;
    position: relative;
}

.mini-head {
    width: 55px;
    height: 55px;
    position: absolute;
    left: 17px;
    top: 35px;
    background: #f2c29b;
    border: 2px solid #555;
}

.mini-hat {
    width: 65px;
    height: 22px;
    position: absolute;
    left: 12px;
    top: 15px;
    background: #1683c5;
    border: 2px solid #555;
    z-index: 2;
}

.mini-brim {
    width: 45px;
    height: 9px;
    position: absolute;
    left: 35px;
    top: 34px;
    background: #1683c5;
    border: 2px solid #555;
    z-index: 3;
}

/* CLOTHES PREVIEW */

.shirt-preview {
    width: 75px;
    height: 85px;
    background: #1683ff;
    border: 3px solid #555;
}

.pants-preview {
    display: flex;
    gap: 3px;
}

.pants-leg {
    width: 35px;
    height: 85px;
    background: #333;
    border: 3px solid #555;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px solid #aaa;
    padding: 40px 20px;
    margin-top: 15px;
    text-align: center;
    color: #777;
}

/* MESSAGE */

#message {
    display: none;
    margin-top: 12px;
    background: white;
    border: 1px solid #aaa;
    padding: 10px;
    color: #1683c5;
    font-weight: bold;
}

/* FOOTER */

footer {
    max-width: 1000px;
    margin: 40px auto 0;
    padding: 15px 10px;
    border-top: 1px solid #aaa;
    color: #777;
}

footer a {
    color: #1683c5;
    text-decoration: none;
}

/* MOBILE */

@media (max-width: 800px) {

    .inventory {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .logo {
        text-align: center;
    }

    nav a {
        padding: 8px 9px;
        font-size: 12px;
    }

    .inventory {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<header>

    <div class="header-inner">

        <div class="logo">
            MTB REVIVALS
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="login.html">Account</a>

            <a href="avatar.html">Avatar</a>

            <a href="accessories.html">Accessories</a>

            <a href="clothes.html">Clothes</a>

            <a href="inventory.html" class="active">
                Inventory
            </a>

            <a href="games.html">Games</a>

            <a href="news.html">News</a>

        </nav>

    </div>

</header>


<div class="container">

    <div class="page-title">
        My Inventory
    </div>


    <div class="toolbar">

        <button onclick="showItems('all')">
            All
        </button>

        <button
            class="gray"
            onclick="showItems('Accessory')">

            Accessories

        </button>

        <button
            class="gray"
            onclick="showItems('Shirt')">

            Shirts

        </button>

        <button
            class="gray"
            onclick="showItems('Pants')">

            Pants

        </button>

        <button
            class="gray"
            onclick="clearInventory()">

            Clear Inventory

        </button>

    </div>


    <div id="message"></div>


    <div
        class="inventory"
        id="inventory">
    </div>


    <div
        class="empty"
        id="empty"
        style="display:none;">

        <h3>Your inventory is empty.</h3>

        <p>
            Visit the catalog to get some items.
        </p>

        <button
            onclick="location.href='accessories.html'">

            Browse Accessories

        </button>

    </div>

</div>


<footer>

    MTB REVIVALS © 2026

    &nbsp; | &nbsp;

    <a href="index.html">Home</a>

    &nbsp; | &nbsp;

    <a href="avatar.html">Avatar</a>

</footer>


<script>

/*
    MTB REVIVALS INVENTORY SYSTEM

    Inventory:
        mtbInventory

    Equipped:
        mtbEquipped
*/


let currentFilter = "all";


/* GET INVENTORY */

function getInventory() {

    return JSON.parse(
        localStorage.getItem("mtbInventory")
    ) || [];

}


/* GET EQUIPPED */

function getEquipped() {

    return JSON.parse(
        localStorage.getItem("mtbEquipped")
    ) || {

        Shirt: null,
        Pants: null,
        Accessory: null

    };

}


/* SAVE EQUIPPED */

function saveEquipped(equipped) {

    localStorage.setItem(
        "mtbEquipped",
        JSON.stringify(equipped)
    );

}


/* LOAD INVENTORY */

function loadInventory() {

    const inventory =
        getInventory();

    const container =
        document.getElementById("inventory");

    const empty =
        document.getElementById("empty");


    container.innerHTML = "";


    let visibleItems = inventory.filter(
        function(item) {

            return (
                currentFilter === "all" ||
                item.type === currentFilter
            );

        }
    );


    if (inventory.length === 0) {

        container.style.display = "none";
        empty.style.display = "block";

        return;

    }


    if (visibleItems.length === 0) {

        container.style.display = "none";
        empty.style.display = "block";

        return;

    }


    container.style.display = "grid";
    empty.style.display = "none";


    visibleItems.forEach(
        function(item, index) {

            createItem(
                item,
                inventory.indexOf(item)
            );

        }
    );

}


/* CREATE ITEM */

function createItem(item, index) {

    const container =
        document.getElementById("inventory");


    const card =
        document.createElement("div");

    card.className = "item";


    /* PREVIEW */

    const preview =
        document.createElement("div");

    preview.className =
        "item-preview";


    if (item.type === "Accessory") {

        const avatar =
            document.createElement("div");

        avatar.className =
            "mini-avatar";


        const head =
            document.createElement("div");

        head.className =
            "mini-head";


        const hat =
            document.createElement("div");

        hat.className =
            "mini-hat";


        const brim =
            document.createElement("div");

        brim.className =
            "mini-brim";


        /*
            Change accessory color
        */

        if (
            item.name
            .toLowerCase()
            .includes("red")
        ) {

            hat.style.background = "#d83232";
            brim.style.background = "#d83232";

        }

        else if (
            item.name
            .toLowerCase()
            .includes("green")
        ) {

            hat.style.background = "#22aa55";
            brim.style.background = "#22aa55";

        }

        else if (
            item.name
            .toLowerCase()
            .includes("fedora")
        ) {

            hat.style.background = "#222";
            brim.style.background = "#222";

        }

        else if (
            item.name
            .toLowerCase()
            .includes("crown")
        ) {

            hat.style.background = "#e6b800";
            brim.style.background = "#e6b800";

        }


        avatar.appendChild(head);
        avatar.appendChild(hat);
        avatar.appendChild(brim);

        preview.appendChild(avatar);

    }


    else if (item.type === "Shirt") {

        const shirt =
            document.createElement("div");

        shirt.className =
            "shirt-preview";

        preview.appendChild(shirt);

    }


    else if (item.type === "Pants") {

        const pants =
            document.createElement("div");

        pants.className =
            "pants-preview";


        const left =
            document.createElement("div");

        left.className =
            "pants-leg";


        const right =
            document.createElement("div");

        right.className =
            "pants-leg";


        pants.appendChild(left);
        pants.appendChild(right);

        preview.appendChild(pants);

    }


    /* NAME */

    const name =
        document.createElement("div");

    name.className =
        "item-name";

    name.textContent =
        item.name;


    /* TYPE */

    const type =
        document.createElement("div");

    type.className =
        "item-type";

    type.textContent =
        item.type;


    /* BUTTONS */

    const buttons =
        document.createElement("div");

    buttons.className =
        "item-buttons";


    const equipped =
        getEquipped();


    const isEquipped =
        equipped[item.type] === item.name;


    const equipButton =
        document.createElement("button");


    if (isEquipped) {

        equipButton.textContent =
            "Unequip";

        equipButton.className =
            "gray";

    } else {

        equipButton.textContent =
            "Equip";

    }


    equipButton.onclick =
        function() {

            toggleEquip(
                item
            );

        };


    const deleteButton =
        document.createElement("button");

    deleteButton.textContent =
        "Remove";

    deleteButton.className =
        "red";


    deleteButton.onclick =
        function() {

            removeItem(index);

        };


    buttons.appendChild(
        equipButton
    );

    buttons.appendChild(
        deleteButton
    );


    card.appendChild(preview);
    card.appendChild(name);
    card.appendChild(type);
    card.appendChild(buttons);


    container.appendChild(card);

}


/* EQUIP / UNEQUIP */

function toggleEquip(item) {

    const equipped =
        getEquipped();


    if (
        equipped[item.type]
        === item.name
    ) {

        equipped[item.type] =
            null;

        showMessage(
            item.name + " unequipped."
        );

    } else {

        equipped[item.type] =
            item.name;

        showMessage(
            item.name + " equipped!"
        );

    }


    saveEquipped(equipped);

    loadInventory();

}


/* REMOVE ITEM */

function removeItem(index) {

    const inventory =
        getInventory();


    if (
        !inventory[index]
    ) {

        return;

    }


    const item =
        inventory[index];


    const equipped =
        getEquipped();


    /*
        Automatically unequip
        the item if necessary.
    */

    if (
        equipped[item.type]
        === item.name
    ) {

        equipped[item.type] =
            null;

        saveEquipped(equipped);

    }


    inventory.splice(
        index,
        1
    );


    localStorage.setItem(
        "mtbInventory",
        JSON.stringify(inventory)
    );


    showMessage(
        item.name + " removed."
    );


    loadInventory();

}


/* FILTER */

function showItems(type) {

    currentFilter = type;

    loadInventory();

}


/* CLEAR INVENTORY */

function clearInventory() {

    const confirmClear =
        confirm(
            "Are you sure you want to clear your inventory?"
        );


    if (!confirmClear) {
        return;
    }


    localStorage.removeItem(
        "mtbInventory"
    );


    localStorage.removeItem(
        "mtbEquipped"
    );


    showMessage(
        "Inventory cleared."
    );


    loadInventory();

}


/* MESSAGE */

function showMessage(text) {

    const message =
        document.getElementById("message");


    message.textContent =
        text;

    message.style.display =
        "block";


    setTimeout(
        function() {

            message.style.display =
                "none";

        },
        2000
    );

}


/* START */

loadInventory();


/*
    Update if another page changes
    the inventory.
*/

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key === "mtbInventory" ||
            event.key === "mtbEquipped"
        ) {

            loadInventory();

        }

    }
);

</script>

</body>

</html>
