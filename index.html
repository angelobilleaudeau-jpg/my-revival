<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Revival</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9e9e9;
            color: #222;
        }

        header {
            background: #c9c9c9;
            padding: 15px;
            border-bottom: 3px solid #999;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            margin-right: 15px;
            color: #222;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            background: white;
            margin: 25px auto;
            padding: 30px;
            max-width: 900px;
            text-align: center;
            border: 1px solid #bbb;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }

        .game {
            background: white;
            padding: 15px;
            border: 1px solid #bbb;
        }

        .thumbnail {
            height: 120px;
            background: #555;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        button {
            background: #1683ff;
            color: white;
            border: 0;
            padding: 10px 18px;
            border-radius: 4px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MY REVIVAL</div>

    <nav>
        <a href="#">Home</a>
        <a href="#games">Games</a>
        <a href="#">Users</a>
        <a href="#">News</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to My Revival!</h1>

    <p>
        A community-made revival inspired by classic online gaming.
    </p>

    <button onclick="alert('Game launcher coming soon!')">
        Play
    </button>
</section>

<section id="games">
    <h2 style="text-align:center;">Featured Games</h2>

    <div class="games">

        <div class="game">
            <div class="thumbnail">GAME 1</div>
            <h3>Classic Obby</h3>
            <p>By Builder</p>
            <button>Play</button>
        </div>

        <div class="game">
            <div class="thumbnail">GAME 2</div>
            <h3>Brick Battle</h3>
            <p>By Admin</p>
            <button>Play</button>
        </div>

        <div class="game">
            <div class="thumbnail">GAME 3</div>
            <h3>Town</h3>
            <p>By Player</p>
            <button>Play</button>
        </div>

    </div>
</section>

<footer>
    © 2026 My Revival
</footer>

</body>
</html>
