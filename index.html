<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>MTB REVIVALS</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#eee;
    color:#222;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   TOP HEADER
========================================================= */

.header{
    height:195px;
    width:100%;
    background:#f15b61;
    color:white;
    position:relative;
    z-index:5000;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
    overflow:visible;
}

.brand{
    position:absolute;
    left:145px;
    top:52px;
    font-size:38px;
    font-weight:bold;
    white-space:nowrap;
}

.brandIcon{
    position:absolute;
    left:92px;
    top:47px;
    width:70px;
    height:65px;
    border:8px solid white;
    border-radius:15px;
    transform:skew(-10deg);
}

.menuButton{
    position:absolute;
    left:17px;
    top:47px;
    width:65px;
    height:65px;
    background:transparent;
    border:0;
    cursor:pointer;
    padding:5px;
}

.menuButton span{
    display:block;
    width:38px;
    height:4px;
    margin:8px auto;
    background:white;
    border-radius:5px;
}


/* =========================================================
   HEADER NAV LINKS
========================================================= */

.topLinks{
    position:absolute;
    left:270px;
    top:57px;
    display:flex;
    gap:25px;
    white-space:nowrap;
}

.topLinks a{
    color:white;
    text-decoration:none;
    font-size:31px;
    font-weight:bold;
}


/* =========================================================
   SEARCH
========================================================= */

.headerSearch{
    position:absolute;
    left:24px;
    top:123px;
    height:55px;
    width:185px;
    display:flex;
}

.headerSearch input{
    width:140px;
    height:55px;
    border:3px solid #ccc;
    border-radius:7px 0 0 7px;
    background:white;
    padding:0 12px;
    font-size:21px;
    outline:none;
}

.headerSearch button{
    width:50px;
    height:55px;
    border:3px solid #ccc;
    border-left:0;
    background:white;
    border-radius:0 7px 7px 0;
    cursor:pointer;
}

.searchIcon{
    width:27px;
    height:27px;
    border:4px solid #222;
    border-radius:50%;
    display:block;
    position:relative;
}

.searchIcon:after{
    content:"";
    position:absolute;
    width:13px;
    height:4px;
    background:#222;
    right:-10px;
    bottom:-5px;
    transform:rotate(45deg);
}


/* =========================================================
   CURRENCY
========================================================= */

.currency{
    position:absolute;
    right:20px;
    top:127px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:29px;
    font-weight:bold;
    white-space:nowrap;
}

.currencyIcon{
    width:48px;
    height:48px;
    border:4px solid white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.tixIcon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:37px;
    transform:rotate(-12deg);
}


/* =========================================================
   SIDE MENU
========================================================= */

.sideMenu{
    position:fixed;
    left:0;
    top:0;
    width:315px;
    max-width:85vw;
    height:100vh;
    background:white;
    z-index:99999;
    box-shadow:5px 0 20px rgba(0,0,0,.3);
    transform:translateX(-105%);
    transition:.25s;
    overflow-y:auto;
}

.sideMenu.open{
    transform:translateX(0);
}

.sideTop{
    height:130px;
    background:#f15b61;
    color:white;
    padding:35px 25px;
    font-size:25px;
    font-weight:bold;
}

.sideUser{
    display:flex;
    align-items:center;
    gap:12px;
}

.sideAvatar{
    width:45px;
    height:45px;
    background:#aaa;
    border-radius:50%;
    border:2px solid white;
}

.sideLinks{
    padding:10px 0;
}

.sideLinks a,
.sideLinks button{
    width:100%;
    display:block;
    text-align:left;
    padding:16px 25px;
    background:white;
    border:0;
    color:#111;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.sideLinks a:hover,
.sideLinks button:hover{
    background:#eee;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:99998;
    display:none;
}

.overlay.show{
    display:block;
}


/* =========================================================
   MAIN
========================================================= */

.page{
    width:100%;
    max-width:1200px;
    margin:auto;
    background:white;
    min-height:calc(100vh - 195px);
    padding:28px 22px 120px;
}

.pageTitle{
    font-size:44px;
    margin:5px 0 25px;
    font-weight:bold;
}


/* =========================================================
   ANNOUNCEMENT
========================================================= */

.announcement{
    background:#ddd;
    color:#333;
    text-align:center;
    font-size:20px;
    padding:12px;
    border-bottom:1px solid #bbb;
}


/* =========================================================
   CATALOG FILTER
========================================================= */

.catalogControls{
    border:1px solid #aaa;
    margin-bottom:25px;
}

.catalogSearch{
    display:flex;
    height:52px;
}

.catalogSearch input{
    flex:1;
    border:0;
    border-right:1px solid #aaa;
    padding:0 15px;
    font-size:19px;
    outline:none;
}

.catalogSearch button{
    width:180px;
    border:0;
    background:#eee;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.categoryHeader{
    background:linear-gradient(#777,#555);
    color:white;
    font-size:27px;
    font-weight:bold;
    padding:12px 18px;
}

.categoryList{
    display:flex;
    flex-wrap:wrap;
}

.category{
    padding:13px 18px;
    font-size:18px;
    border-right:1px solid #ccc;
    cursor:pointer;
}

.category:hover{
    background:#eee;
}


/* =========================================================
   ITEM GRID
========================================================= */

.itemGrid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
}

.item{
    border:1px solid #d2d2d2;
    background:white;
    box-shadow:0 2px 7px rgba(0,0,0,.12);
    min-width:0;
}

.itemImage{
    height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fafafa;
    overflow:hidden;
}

.itemInfo{
    border-top:1px solid #ddd;
    padding:12px;
}

.itemName{
    font-size:20px;
    font-weight:bold;
    min-height:48px;
}

.itemPrice{
    color:#078c45;
    font-size:23px;
    font-weight:bold;
    margin-top:10px;
}

.itemPrice.free{
    color:#078c45;
}

.claimButton{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:0;
    background:#4382dc;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.claimButton:hover{
    background:#2868c0;
}


/* =========================================================
   FAKE CLASSIC ITEMS
========================================================= */

.fakeValk{
    width:130px;
    height:130px;
    background:linear-gradient(135deg,#283eae,#91a8ff);
    clip-path:polygon(
        50% 0,65% 28%,95% 8%,78% 45%,
        100% 70%,65% 64%,50% 100%,
        35% 64%,0 70%,22% 45%,5% 8%,35% 28%
    );
}

.fakeRedValk{
    width:130px;
    height:130px;
    background:linear-gradient(135deg,#9c1717,#ff5555);
    clip-path:polygon(
        50% 0,65% 28%,95% 8%,78% 45%,
        100% 70%,65% 64%,50% 100%,
        35% 64%,0 70%,22% 45%,5% 8%,35% 28%
    );
}

.fakeHorns{
    width:145px;
    height:125px;
    background:linear-gradient(135deg,#b8f5ff,#489eff);
    clip-path:polygon(
        50% 0,65% 30%,100% 5%,78% 48%,
        100% 76%,65% 66%,50% 100%,
        35% 66%,0 76%,22% 48%,0 5%,35% 30%
    );
}

.fakeFedora{
    width:145px;
    height:85px;
    background:linear-gradient(
        90deg,
        #d93434,
        #f0ce39,
        #39bf65,
        #438bdd,
        #a345d4
    );
    border-radius:55% 55% 18% 18%;
}

.fakePencil{
    width:35px;
    height:165px;
    background:linear-gradient(
        90deg,
        #c88311,
        #ffe04b,
        #c88311
    );
    transform:rotate(-25deg);
    border:3px solid #75500a;
}

.fakeShirt{
    width:125px;
    height:150px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:30px;
    font-weight:bold;
}

.fakeHair{
    width:130px;
    height:105px;
    background:#5a3518;
    border-radius:60% 60% 25% 25%;
}

.fakeBurger{
    width:150px;
    height:105px;
    border-radius:50%;
    background:
        linear-gradient(
            #c79c3b 0 35%,
            #bd2e24 35% 45%,
            #e5d25d 45% 55%,
            #60351f 55% 75%,
            #8e6a28 75%
        );
}


/* =========================================================
   AVATAR SECTION
========================================================= */

.avatarPanel{
    margin-top:35px;
    border:1px solid #bbb;
    background:#f5f5f5;
    padding:20px;
}

.avatarPanel h2{
    margin-top:0;
    font-size:32px;
}

.avatarStage{
    width:100%;
    height:520px;
    background:#e9e9e9;
    border:1px solid #bbb;
    position:relative;
    overflow:hidden;
}


/* =========================================================
   R6 AVATAR
========================================================= */

.avatar{
    position:absolute;
    width:260px;
    height:445px;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
}


/* HEAD */

.avatarHead{
    position:absolute;
    width:100px;
    height:100px;
    left:80px;
    top:0;
    background:#efbd76;
    border:4px solid #555;
    border-radius:9px;
}

.avatarHead:before,
.avatarHead:after{
    content:"";
    position:absolute;
    top:42px;
    width:10px;
    height:16px;
    background:#111;
    border-radius:50%;
}

.avatarHead:before{
    left:27px;
}

.avatarHead:after{
    right:27px;
}


/* BODY */

.avatarBody{
    position:absolute;
    left:60px;
    top:108px;
    width:140px;
    height:145px;
    background:#111;
    border:4px solid #444;
}

.avatarBody:after{
    content:"MTB";
    position:absolute;
    left:0;
    right:0;
    top:48px;
    text-align:center;
    color:white;
    font-size:35px;
    font-weight:bold;
}


/* ARMS */

.avatarArm{
    position:absolute;
    width:48px;
    height:135px;
    top:112px;
    background:#efbd76;
    border:4px solid #555;
    border-radius:3px;
    transition:.25s;
}

.leftArm{
    left:10px;
}

.rightArm{
    right:10px;
}

.holding .rightArm{
    transform:rotate(-55deg);
    transform-origin:top center;
}


/* LEGS */

.avatarLeg{
    position:absolute;
    width:60px;
    height:140px;
    top:253px;
    background:#222;
    border:4px solid #444;
}

.leftLeg{
    left:60px;
}

.rightLeg{
    right:60px;
}


/* =========================================================
   AVATAR ACCESSORIES
========================================================= */

.avatarAccessory{
    display:none;
    position:absolute;
    z-index:10;
}

.wearing-horns .avatarAccessory.horns{
    display:block;
}

.horns{
    width:170px;
    height:130px;
    left:45px;
    top:-35px;
    background:linear-gradient(
        135deg,
        #c5f9ff,
        #4ba8ff,
        #1438a7
    );
    clip-path:polygon(
        50% 0,
        65% 35%,
        100% 5%,
        78% 50%,
        100% 80%,
        65% 65%,
        50% 100%,
        35% 65%,
        0 80%,
        22% 50%,
        0 5%,
        35% 35%
    );
}

.wearing-fedora .avatarAccessory.fedora{
    display:block;
}

.fedora{
    width:140px;
    height:65px;
    left:60px;
    top:-35px;
    background:linear-gradient(
        90deg,
        #e83232,
        #e8c634,
        #35bd66,
        #418cdf,
        #a345d4
    );
    border-radius:50% 50% 15% 15%;
}

.wearing-valk .avatarAccessory.valk{
    display:block;
}

.valk{
    width:145px;
    height:130px;
    left:57px;
    top:-45px;
    background:linear-gradient(
        135deg,
        #3145bb,
        #91a8ff
    );
    clip-path:polygon(
        50% 0,
        65% 30%,
        100% 8%,
        78% 48%,
        100% 70%,
        65% 65%,
        50% 100%,
        35% 65%,
        0 70%,
        22% 48%,
        0 8%,
        35% 30%
    );
}


/* =========================================================
   GEAR
========================================================= */

.gear{
    display:none;
    position:absolute;
    z-index:20;
}

.holding .gear{
    display:block;
}

.pencilGear{
    right:-20px;
    top:185px;
    width:28px;
    height:150px;
    background:linear-gradient(
        90deg,
        #c98211,
        #ffe34d,
        #c98211
    );
    transform:rotate(-25deg);
    border:3px solid #70500b;
}

.swordGear{
    right:-20px;
    top:180px;
    width:30px;
    height:145px;
    background:linear-gradient(
        90deg,
        #555,
        white,
        #888
    );
    transform:rotate(-25deg);
    clip-path:polygon(
        50% 0,
        100% 15%,
        65% 100%,
        35% 100%,
        0 15%
    );
}


/* =========================================================
   AVATAR CONTROLS
========================================================= */

.avatarControls{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.avatarControls button{
    padding:13px;
    background:white;
    border:1px solid #aaa;
    cursor:pointer;
    font-weight:bold;
}

.avatarControls button:hover{
    background:#eee;
}


/* =========================================================
   EQUIPPED
========================================================= */

.equipped{
    background:white;
    border:1px solid #bbb;
    padding:18px;
    margin-top:18px;
}

.equippedTitle{
    font-size:24px;
    font-weight:bold;
}

.slots{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.slot{
    flex:1;
    min-width:0;
    height:65px;
    border:2px dashed #aaa;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:13px;
    padding:5px;
}


/* =========================================================
   PROFILE
========================================================= */

.profile{
    max-width:900px;
    margin:auto;
}

.profileTop{
    background:white;
    border:1px solid #ccc;
    padding:25px;
}

.profileAvatar{
    width:150px;
    height:150px;
    margin:auto;
    border-radius:50%;
    border:2px solid #bbb;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
}

.profileName{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    margin-top:15px;
}

.username{
    text-align:center;
    color:#777;
    font-size:22px;
}

.badges{
    text-align:center;
    margin-top:15px;
}

.badge{
    display:inline-block;
    padding:7px 12px;
    margin:4px;
    background:#4382dc;
    color:white;
    border-radius:4px;
    font-size:14px;
    font-weight:bold;
}

.badge.owner{
    background:#e22d2d;
}

.badge.first{
    background:#e3a625;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    margin-top:25px;
    border-top:1px solid #ddd;
    padding-top:20px;
    text-align:center;
}

.statTitle{
    color:#aaa;
    font-size:18px;
}

.statNumber{
    color:#4382dc;
    font-size:28px;
    font-weight:bold;
}


/* =========================================================
   AUTH
========================================================= */

.authBox{
    max-width:430px;
    margin:30px auto;
    background:white;
    border:1px solid #ccc;
    padding:25px;
}

.authBox h1{
    margin-top:0;
}

.authBox input{
    width:100%;
    height:50px;
    margin-bottom:12px;
    border:1px solid #aaa;
    padding:10px;
    font-size:17px;
}

.authButton{
    width:100%;
    height:48px;
    background:#4382dc;
    color:white;
    border:0;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.authSwitch{
    margin-top:15px;
    color:#4382dc;
    cursor:pointer;
    text-align:center;
}


/* =========================================================
   INVENTORY
========================================================= */

.inventoryGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.inventoryItem{
    border:1px solid #ccc;
    padding:15px;
    background:white;
    text-align:center;
}

.inventoryImage{
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.inventoryItem button{
    width:100%;
    margin-top:10px;
    padding:9px;
    border:0;
    background:#4382dc;
    color:white;
    cursor:pointer;
}


/* =========================================================
   GAMES
========================================================= */

.gameGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.game{
    background:white;
    border:1px solid #ccc;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.gameImage{
    height:180px;
    background:linear-gradient(
        135deg,
        #4e6fd0,
        #222
    );
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:30px;
    font-weight:bold;
}

.gameInfo{
    padding:15px;
}

.playButton{
    width:100%;
    padding:11px;
    background:#4382dc;
    border:0;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


/* =========================================================
   USER SEARCH
========================================================= */

.userSearch{
    margin-top:35px;
    background:#f5f5f5;
    border:1px solid #ccc;
    padding:20px;
}

.userSearch input{
    width:100%;
    height:50px;
    padding:10px;
    border:1px solid #aaa;
    font-size:18px;
}

.userSearch button{
    margin-top:10px;
    padding:12px 25px;
    background:#4382dc;
    color:white;
    border:0;
    font-weight:bold;
    cursor:pointer;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalBox{
    background:white;
    width:100%;
    max-width:430px;
    padding:25px;
    border-radius:5px;
}

.modalBox h2{
    margin-top:0;
}

.modalButtons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modalButtons button{
    flex:1;
    padding:13px;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.confirm{
    background:#4382dc;
    color:white;
}

.cancel{
    background:#ddd;
}


/* =========================================================
   BOTTOM CHAT
========================================================= */

.chat{
    position:fixed;
    bottom:0;
    left:20px;
    right:20px;
    height:62px;
    background:#f15b61;
    color:white;
    z-index:8000;
    border-radius:12px 12px 0 0;
    display:flex;
    align-items:center;
    padding-left:22px;
    font-size:22px;
    font-weight:bold;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:1000px){

    .header{
        height:160px;
    }

    .page{
        min-height:calc(100vh - 160px);
    }

    .headerSearch{
        top:90px;
    }

    .currency{
        top:92px;
    }

    .brand{
        top:45px;
    }

    .brandIcon{
        top:40px;
    }

    .menuButton{
        top:40px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header{
        height:195px;
    }

    .brand{
        left:150px;
        top:55px;
        font-size:35px;
    }

    .brandIcon{
        left:91px;
        top:48px;
        width:62px;
        height:57px;
        border-width:7px;
    }

    .topLinks{
        display:none;
    }

    .currency{
        right:12px;
        top:128px;
        gap:7px;
        font-size:24px;
    }

    .currencyIcon{
        width:45px;
        height:45px;
    }

/* =========================================================
   MTB REVIVALS DATA
========================================================= */

const SAVE_KEY = "MTB_REVIVALS_V3";

const FIRST10_KEY = "MTB_FIRST10_COUNT";

let users =
    JSON.parse(
        localStorage.getItem(
            "MTB_REVIVALS_USERS"
        )
    ) || [];


let currentUser =
    localStorage.getItem(
        "MTB_CURRENT_USER"
    ) || null;


let player = null;

let pendingAction = null;


/* =========================================================
   DEFAULT USER
========================================================= */

function defaultPlayer(username){

    return {

        username:username,

        displayName:username,

        robux:100,

        tix:0,

        owned:[],

        equipped:{
            shirt:null,
            pants:null,
            accessories:[],
            gear:null
        },

        badges:[],

        friends:0,

        followers:0,

        following:0,

        rap:0

    };
}


/* =========================================================
   LOAD USER
========================================================= */

function loadUser(){

    if(!currentUser){

        player = null;

        return;
    }

    let found =
        users.find(
            u => u.username.toLowerCase()
                === currentUser.toLowerCase()
        );

    if(found){

        player = found;

    }else{

        currentUser = null;

        localStorage.removeItem(
            "MTB_CURRENT_USER"
        );

        player = null;
    }
}


/* =========================================================
   SAVE USERS
========================================================= */

function saveUsers(){

    localStorage.setItem(
        "MTB_REVIVALS_USERS",
        JSON.stringify(users)
    );
}


/* =========================================================
   SAVE PLAYER
========================================================= */

function savePlayer(){

    if(!player){
        return;
    }

    const index =
        users.findIndex(
            u => u.username.toLowerCase()
            === player.username.toLowerCase()
        );

    if(index !== -1){

        users[index] = player;

    }else{

        users.push(player);
    }

    saveUsers();

    updateHeader();
}


/* =========================================================
   FIRST 10 SYSTEM
========================================================= */

function giveFirst10Badge(){

    if(!player){
        return;
    }

    if(
        player.badges.includes(
            "first10"
        )
    ){
        return;
    }

    let count =
        parseInt(
            localStorage.getItem(
                FIRST10_KEY
            ) || "0"
        );

    if(count < 10){

        count++;

        localStorage.setItem(
            FIRST10_KEY,
            String(count)
        );

        player.badges.push(
            "first10"
        );

        savePlayer();

        alert(
            "🎉 You are one of the first 10 MTB REVIVALS users!"
        );
    }
}


/* =========================================================
   MTB OWNER
========================================================= */

function applyOwnerBadge(){

    if(!player){
        return;
    }

    if(
        player.username.toLowerCase()
        === "mtb"
    ){

        if(
            !player.badges.includes(
                "owner"
            )
        ){

            player.badges.push(
                "owner"
            );
        }

        savePlayer();
    }
}

/* =========================================================
   DRAW CATALOG
========================================================= */

function drawCatalog(items){

    const grid =
        document.getElementById(
            "catalogGrid"
        );

    if(!grid){
        return;
    }

    grid.innerHTML = "";

    items.forEach(item=>{

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "item";

        div.dataset.name =
            item.name.toLowerCase();

        div.dataset.type =
            item.type;

        div.innerHTML = `

            <div class="itemImage">

                <div class="${item.visual}">
                    ${
                        item.visual === "fakeShirt"
                        ? "MTB"
                        : ""
                    }
                </div>

            </div>

            <div class="itemInfo">

                <div class="itemName">
                    ${escapeHTML(item.name)}
                </div>

                <div class="itemPrice">
                    ${
                        item.price === 0
                        ? "FREE"
                        : "R$ " + item.price
                    }
                </div>

                <button
                    class="claimButton"
                    onclick="buyItem('${item.id}')">
                    ${
                        owned(item.id)
                        ? "WEAR"
                        : "CLAIM"
                    }
                </button>

            </div>

        `;

        grid.appendChild(div);
    });
}


/* =========================================================
   FILTER
========================================================= */

function filterCatalog(){

    const input =
        document.getElementById(
            "catalogSearchInput"
        );

    if(!input){
        return;
    }

    const query =
        input.value
            .toLowerCase()
            .trim();

    drawCatalog(
        catalogItems.filter(
            item =>
            item.name
                .toLowerCase()
                .includes(query)
        )
    );
}


function filterCategory(type){

    if(type==="all"){

        drawCatalog(
            catalogItems
        );

        return;
    }

    drawCatalog(
        catalogItems.filter(
            item =>
            item.type === type
        )
    );
}


/* =========================================================
   OWNED
========================================================= */

function owned(id){

    if(!player){
        return false;
    }

    return player.owned.some(
        item => item.id === id
    );
}


/* =========================================================
   BUY
========================================================= */

function buyItem(id){

    if(!player){

        showPage("auth");

        alert(
            "Please sign up or log in first."
        );

        return;
    }

    const item =
        catalogItems.find(
            x => x.id === id
        );

    if(!item){
        return;
    }

    if(owned(id)){

        equipItem(item);

        return;
    }

    pendingAction = {

        action:"buy",

        item:item

    };

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Confirm Order";

    document.getElementById(
        "modalText"
    ).innerHTML = `

        <strong>
            ${escapeHTML(item.name)}
        </strong>

        <br><br>

        Price:
        <strong>
            ${
                item.price === 0
                ? "FREE"
                : "R$ " + item.price
            }
        </strong>

        <br><br>

        Do you want to claim this item?

    `;

    document.getElementById(
        "modal"
    ).classList.add("show");
}


/* =========================================================
   CONFIRM
========================================================= */

function confirmAction(){

    if(!pendingAction){
        return;
    }

    const item =
        pendingAction.item;

    if(
        item.price > 0 &&
        player.robux < item.price
    ){

        alert(
            "You don't have enough Robux."
        );

        closeModal();

        return;
    }

    if(item.price > 0){

        player.robux -=
            item.price;
    }

    player.owned.push({

        id:item.id,

        name:item.name,

        type:item.type,

        price:item.price

    });

    savePlayer();

    equipItem(item);

    closeModal();

    if(
        document.getElementById(
            "catalogGrid"
        )
    ){
        drawCatalog(
            catalogItems
        );
    }
}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    pendingAction =
        null;

    document
        .getElementById("modal")
        .classList.remove("show");
}


/* =========================================================
   EQUIP
========================================================= */

function equipItem(item){

    if(!player){
        return;
    }

    if(item.type==="accessory"){

        const index =
            player.equipped
                .accessories
                .indexOf(item.id);

        if(index !== -1){

            player.equipped
                .accessories
                .splice(
                    index,
                    1
                );

        }else{

            if(
                player.equipped
                    .accessories
                    .length >= 3
            ){

                alert(
                    "You can only wear 3 accessories."
                );

                return;
            }

            player.equipped
                .accessories
                .push(item.id);
        }

    }

    if(item.type==="shirt"){

        player.equipped.shirt =
            item.id;
    }

    if(item.type==="gear"){

        player.equipped.gear =
            item.id;
    }

    savePlayer();

    renderAvatar();
}

========================================================= */

function avatarClasses(){

    if(!player){
        return "";
    }

    let classes = "";

    if(
        player.equipped
            .accessories
            .includes("frozen-horns") ||
        player.equipped
            .accessories
            .includes("classic-horns")
    ){
        classes +=
            " wearing-horns";
    }

    if(
        player.equipped
            .accessories
            .includes("fedora") ||
        player.equipped
            .accessories
            .includes("blue-fedora")
    ){
        classes +=
            " wearing-fedora";
    }

    if(
        player.equipped
            .accessories
            .includes("valk") ||
        player.equipped
            .accessories
            .includes("red-valk")
    ){
        classes +=
            " wearing-valk";
    }

    if(player.equipped.gear){
        classes += " holding";
    }

    return classes;
}

/* =========================================================
   INVENTORY
========================================================= */

function renderInventory(){

    if(!player){

        showPage("auth");

        return;
    }

    const main =
        document.getElementById(
            "main"
        );

    main.innerHTML = `

        <h1 class="pageTitle">
            Inventory
        </h1>

        <div
            id="inventoryGrid"
            class="inventoryGrid">
        </div>

    `;

    const grid =
        document.getElementById(
            "inventoryGrid"
        );

    if(player.owned.length===0){

        grid.innerHTML =
            "<p>You don't own any items yet.</p>";

        return;
    }

    player.owned.forEach(
        ownedItem=>{

            const item =
                catalogItems.find(
                    x =>
                    x.id === ownedItem.id
                );

            if(!item){
                return;
            }

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "inventoryItem";

            div.innerHTML = `

                <div class="inventoryImage">

                    <div class="${item.visual}">
                        ${
                            item.visual === "fakeShirt"
                            ? "MTB"
                            : ""
                        }
                    </div>

                </div>

                <strong>
                    ${escapeHTML(item.name)}
                </strong>

                <button
                    onclick="equipItemById('${item.id}')">
                    ${
                        isEquipped(item.id)
                        ? "UNEQUIP"
                        : "WEAR"
                    }
                </button>

            `;

            grid.appendChild(div);

        }
    );
}


/* =========================================================
   EQUIPPED CHECK
========================================================= */

function isEquipped(id){

    if(!player){
        return false;
    }

    return (
        player.equipped.shirt === id ||
        player.equipped.gear === id ||
        player.equipped
            .accessories
            .includes(id)
    );
}


/* =========================================================
   EQUIP BY ID
========================================================= */

function equipItemById(id){

    const item =
        catalogItems.find(
            x => x.id === id
        );

    if(item){

        equipItem(item);
    }

    renderInventory();
}

/* =========================================================
   SIGNUP
========================================================= */

function signup(){

    const username =
        document
        .getElementById(
            "signupUsername"
        )
        .value
        .trim();

    const password =
        document
        .getElementById(
            "signupPassword"
        )
        .value;

    if(
        username.length < 3
    ){

        alert(
            "Username must be at least 3 characters."
        );

        return;
    }

    if(
        password.length < 6
    ){

        alert(
            "Password must be at least 6 characters."
        );

        return;
    }

    if(
        users.some(
            u =>
            u.username.toLowerCase()
            === username.toLowerCase()
        )
    ){

        alert(
            "That username already exists."
        );

        return;
    }


    const newUser =
        defaultPlayer(
            username
        );

    /*
       DEMO ONLY:
       Passwords are stored locally.
       Use a real backend for production.
    */

    newUser.password =
        password;

    users.push(
        newUser
    );

    player =
        newUser;

    currentUser =
        username;

    localStorage.setItem(
        "MTB_CURRENT_USER",
        username
    );

    saveUsers();

    applyOwnerBadge();

    giveFirst10Badge();

    updateHeader();

    alert(
        "Welcome to MTB REVIVALS!"
    );

    showPage("profile");
}


/* =========================================================
   LOGIN
========================================================= */

function login(){

    const username =
        document
        .getElementById(
            "loginUsername"
        )
        .value
        .trim();

    const password =
        document
        .getElementById(
            "loginPassword"
        )
        .value;

    const found =
        users.find(
            u =>
            u.username.toLowerCase()
            === username.toLowerCase()
            &&
            u.password === password
        );

    if(!found){

        alert(
            "Incorrect username or password."
        );

        return;
    }

    player =
        found;

    currentUser =
        found.username;

    localStorage.setItem(
        "MTB_CURRENT_USER",
        found.username
    );

    applyOwnerBadge();

    updateHeader();

    showPage("profile");
}

/* =========================================================
   USER SEARCH
========================================================= */

function searchUsers(){

    const input =
        document.getElementById(
            "userSearchInput"
        );

    const results =
        document.getElementById(
            "userResults"
        );

    if(!input || !results){
        return;
    }

    const query =
        input.value
            .trim()
            .toLowerCase();

    if(!query){

        results.innerHTML =
            "<p>Enter a username.</p>";

        return;
    }

    const matches =
        users.filter(
            u =>
            u.username
                .toLowerCase()
                .includes(query)
        );

    if(matches.length===0){

        results.innerHTML =
            "<p>User not found.</p>";

        return;
    }

    results.innerHTML =
        matches.map(
            u => `

                <div
                    style="
                    margin-top:15px;
                    padding:15px;
                    background:white;
                    border:1px solid #ccc;
                    "
                >

                    <strong>
                        ${escapeHTML(
                            u.username
                        )}
                    </strong>

                    <br>

                    <span
                        style="
                        color:#777;
                        "
                    >
                        ${u.followers}
                        Followers
                    </span>

                    <br><br>

                    ${
                        u.badges.includes("owner")
                        ?
                        '<span class="badge owner">✓ MTB OWNER</span>'
                        :
                        ''
                    }

                    ${
                        u.badges.includes("first10")
                        ?
                        '<span class="badge first">★ FIRST 10</span>'
                        :
                        ''
                    }

                </div>

            `
        ).join("");
}

    }
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
