```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avatar - MTB REVIVALS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e9e9e9;
            color: #222;
        }

        header {
            background: #c9c9c9;
            padding: 15px;
            border-bottom: 3px solid #999;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 14px;
            border-radius: 5px;
        }

        nav a:hover,
        nav a.active {
            background: #aaa;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 15px;
        }

        h1 {
            text-align: center;
        }

        .avatar-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            background: white;
            border: 1px solid #bbb;
            padding: 25px;
        }

        /* AVATAR */

        .preview {
            text-align: center;
        }

        .avatar {
            width: 190px;
            height: 300px;
            margin: 20px auto;
            position: relative;
        }

        .head {
            width: 90px;
            height: 90px;
            background: #f2c29b;
            border: 3px solid #333;
            border-radius: 10px;
            position: absolute;
            top: 0;
            left: 50px;
            z-index: 3;
        }

        .hair {
            width: 90px;
            height: 30px;
            background: #222;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 10px 10px 0 0;
        }

        .eye {
            width: 9px;
            height: 9px;
            background: #222;
            border-radius: 50%;
            position: absolute;
            top: 42px;
        }

        .eye.left {
            left: 25px;
        }

        .eye.right {
            right: 25px;
        }

        .body {
            width: 100px;
            height: 115px;
            background: #1683ff;
            border: 3px solid #333;
            position: absolute;
            top: 92px;
            left: 45px;
        }

        .arm {
            width: 35px;
            height: 105px;
            background: #f2c29b;
            border: 3px solid #333;
            position: absolute;
            top: 97px;
        }

        .arm.left {
            left: 8px;
        }

        .arm.right {
            right: 8px;
        }

        .leg {
            width: 43px;
            height: 95px;
            background: #333;
            border: 3px solid #222;
            position: absolute;
            top: 205px;
        }

        .leg.left {
            left: 48px;
        }

        .leg.right {
            right: 48px;
        }

        /* CONTROLS */

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #1683ff;
            color: white;
            border: 0;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #006bd6;
        }

        .reset {
            background: #777;
        }

        .reset:hover {
            background: #555;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .not-logged-in {
            text-align: center;
            background: white;
            border: 1px solid #bbb;
            padding: 30px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .logo {
                font-size: 24px;
            }

            nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            nav a {
                text-align: center;
                font-size: 14px;
                padding: 11px 4px;
            }

            .avatar-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        MTB REVIVALS
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Account</a>
        <a href="avatar.html" class="active">Avatar</a>
        <a href="accessories.html">Accessories</a>
        <a href="clothes.html">Clothes</a>
        <a href="inventory.html">Inventory</a>
        <a href="games.html">Games</a>
        <a href="news.html">News</a>
    </nav>

</header>

<div class="container">

    <h1>Avatar</h1>

    <div id="notLoggedIn" class="not-logged-in" style="display:none;">

        <h2>You are not logged in.</h2>

        <p>
            Log in to customize your MTB REVIVALS avatar.
        </p>

        <a href="login.html">
            <button>GO TO LOGIN</button>
        </a>

    </div>


    <div id="avatarArea" class="avatar-area">

        <!-- PREVIEW -->

        <div class="box preview">

            <h2>Avatar Preview</h2>

            <div class="avatar">

                <div class="head" id="head">
                    <div class="hair" id="hair"></div>

                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>

                <div class="body" id="body"></div>

                <div class="arm left"></div>
                <div class="arm right"></div>

                <div class="leg left"></div>
                <div class="leg right"></div>

            </div>

            <h3 id="username"></h3>

        </div>


        <!-- CUSTOMIZATION -->

        <div class="box">

            <h2>Customize</h2>

            <label>Skin Color</label>

            <select id="skinColor" onchange="updateAvatar()">

                <option value="#f2c29b">Light</option>
                <option value="#d99a6c">Tan</option>
                <option value="#a96f45">Brown</option>
                <option value="#70452b">Dark</option>

            </select>


            <label>Shirt Color</label>

            <select id="shirtColor" onchange="updateAvatar()">

                <option value="#1683ff">Blue</option>
                <option value="#ff3333">Red</option>
                <option value="#22aa55">Green</option>
                <option value="#8b45d6">Purple</option>
                <option value="#222222">Black</option>
                <option value="#eeeeee">White</option>

            </select>


            <label>Pants Color</label>

            <select id="pantsColor" onchange="updateAvatar()">

                <option value="#333333">Black</option>
                <option value="#1683ff">Blue</option>
                <option value="#777777">Gray</option>
                <option value="#8b5a2b">Brown</option>

            </select>


            <label>Hair Color</label>

            <select id="hairColor" onchange="updateAvatar()">

                <option value="#222222">Black</option>
                <option value="#5a3518">Brown</option>
                <option value="#d9a441">Blonde</option>
                <option value="#eeeeee">White</option>

            </select>


            <button onclick="saveAvatar()">
                SAVE AVATAR
            </button>

            <button class="reset" onclick="resetAvatar()">
                RESET
            </button>

            <div id="message"></div>

        </div>

    </div>

</div>

<script>

    /* CHECK LOGIN */

    let loggedIn =
        localStorage.getItem("mtbLoggedIn");

    let savedAccount =
        localStorage.getItem("mtbAccount");


    if (loggedIn !== "true" || !savedAccount) {

        document.getElementById("avatarArea")
            .style.display = "none";

        document.getElementById("notLoggedIn")
            .style.display = "block";

    } else {

        let account =
            JSON.parse(savedAccount);

        document.getElementById("username")
            .textContent = account.username;

    }


    /* UPDATE AVATAR */

    function updateAvatar() {

        let skin =
            document.getElementById("skinColor").value;

        let shirt =
            document.getElementById("shirtColor").value;

        let pants =
            document.getElementById("pantsColor").value;

        let hair =
            document.getElementById("hairColor").value;


        document.getElementById("head")
            .style.background = skin;

        document.querySelectorAll(".arm")
            .forEach(function(arm) {
                arm.style.background = skin;
            });

        document.getElementById("body")
            .style.background = shirt;

        document.querySelectorAll(".leg")
            .forEach(function(leg) {
                leg.style.background = pants;
            });

        document.getElementById("hair")
            .style.background = hair;

    }


    /* SAVE */

    function saveAvatar() {

        let avatar = {

            skin:
                document.getElementById("skinColor").value,

            shirt:
                document.getElementById("shirtColor").value,

            pants:
                document.getElementById("pantsColor").value,

            hair:
                document.getElementById("hairColor").value

        };


        localStorage.setItem(
            "mtbAvatar",
            JSON.stringify(avatar)
        );


        document.getElementById("message")
            .textContent =
            "Avatar saved!";

    }


    /* LOAD */

    function loadAvatar() {

        let saved =
            localStorage.getItem("mtbAvatar");


        if (!saved) {

            updateAvatar();
            return;

        }


        let avatar =
            JSON.parse(saved);


        document.getElementById("skinColor")
            .value = avatar.skin;

        document.getElementById("shirtColor")
            .value = avatar.shirt;

        document.getElementById("pantsColor")
            .value = avatar.pants;

        document.getElementById("hairColor")
            .value = avatar.hair;


        updateAvatar();

    }


    /* RESET */

    function resetAvatar() {

        localStorage.removeItem("mtbAvatar");


        document.getElementById("skinColor")
            .value = "#f2c29b";

        document.getElementById("shirtColor")
            .value = "#1683ff";

        document.getElementById("pantsColor")
            .value = "#333333";

        document.getElementById("hairColor")
            .value = "#222222";


        updateAvatar();


        document.getElementById("message")
            .textContent =
            "Avatar reset!";

    }


    loadAvatar();

</script>

</body>
</html>
