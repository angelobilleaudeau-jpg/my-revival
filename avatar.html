```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Avatar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    background: #e8e8e8;
    color: #333;
}

/* HEADER */

header {
    background: linear-gradient(#f7f7f7, #d1d1d1);
    border-bottom: 1px solid #999;
    box-shadow: 0 1px 3px #aaa;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 8px 10px 0;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #333;
    padding: 5px 0 10px;
}

/* NAVIGATION */

nav {
    display: flex;
    flex-wrap: wrap;
}

nav a {
    display: block;
    padding: 9px 13px;
    color: #444;
    text-decoration: none;
    border: 1px solid transparent;
    border-bottom: 0;
    text-decoration: none;
}

nav a:hover {
    background: #ddd;
}

nav a.active {
    background: white;
    border: 1px solid #aaa;
    border-bottom: 1px solid white;
    color: #1683c5;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 10px;
}

.page-title {
    background: linear-gradient(#666, #444);
    color: white;
    padding: 9px 12px;
    border: 1px solid #333;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px #222;
}

/* AVATAR AREA */

.avatar-panel {
    margin-top: 15px;
    background: white;
    border: 1px solid #aaa;
    display: grid;
    grid-template-columns: 1fr 280px;
    min-height: 500px;
}

/* PREVIEW */

.preview {
    min-height: 500px;
    background:
        linear-gradient(#f7f7f7 1px, transparent 1px),
        linear-gradient(90deg, #f7f7f7 1px, transparent 1px);
    background-size: 25px 25px;
    position: relative;
    overflow: hidden;
}

.preview-title {
    position: absolute;
    top: 12px;
    left: 12px;
    font-weight: bold;
    color: #666;
}

/* AVATAR */

.avatar {
    position: absolute;
    width: 220px;
    height: 390px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -45%);
}

/* HEAD */

.head {
    position: absolute;
    width: 78px;
    height: 78px;
    left: 71px;
    top: 10px;
    background: #f2c29b;
    border: 3px solid #555;
    z-index: 5;
}

/* FACE */

.face {
    position: absolute;
    left: 17px;
    top: 29px;
    width: 8px;
    height: 8px;
    background: #222;
    box-shadow:
        34px 0 #222;
}

.mouth {
    position: absolute;
    left: 27px;
    top: 49px;
    width: 23px;
    height: 5px;
    background: #555;
}

/* BODY */

.body {
    position: absolute;
    width: 105px;
    height: 120px;
    left: 57px;
    top: 88px;
    background: #1683ff;
    border: 3px solid #555;
    z-index: 3;
}

/* LEFT ARM */

.arm.left {
    position: absolute;
    width: 45px;
    height: 120px;
    left: 9px;
    top: 88px;
    background: #f2c29b;
    border: 3px solid #555;
    z-index: 2;
}

/* RIGHT ARM */

.arm.right {
    position: absolute;
    width: 45px;
    height: 120px;
    right: 9px;
    top: 88px;
    background: #f2c29b;
    border: 3px solid #555;
    z-index: 2;
}

/* LEGS */

.leg {
    position: absolute;
    width: 50px;
    height: 130px;
    top: 208px;
    background: #333;
    border: 3px solid #555;
    z-index: 2;
}

.leg.left {
    left: 57px;
}

.leg.right {
    right: 57px;
}

/* FEET */

.foot {
    position: absolute;
    width: 50px;
    height: 25px;
    top: 338px;
    background: #222;
    border: 3px solid #555;
}

.foot.left {
    left: 57px;
}

.foot.right {
    right: 57px;
}

/* HAT */

.hat {
    position: absolute;
    left: 58px;
    top: -3px;
    width: 105px;
    height: 35px;
    background: #1683c5;
    border: 3px solid #555;
    z-index: 10;
}

.hat-brim {
    position: absolute;
    left: 85px;
    top: 26px;
    width: 65px;
    height: 12px;
    background: #1683c5;
    border: 3px solid #555;
    z-index: 11;
}

/* CONTROLS */

.controls {
    border-left: 1px solid #aaa;
    padding: 15px;
    background: #fafafa;
}

.controls-title {
    font-size: 17px;
    font-weight: bold;
    border-bottom: 1px solid #aaa;
    padding-bottom: 8px;
    margin-bottom: 12px;
}

.equipped-box {
    border: 1px solid #aaa;
    background: white;
    margin-bottom: 10px;
}

.equipped-header {
    background: linear-gradient(#eee, #ccc);
    padding: 7px;
    font-weight: bold;
}

.equipped-content {
    padding: 9px;
    min-height: 35px;
}

.empty {
    color: #888;
}

.item-name {
    color: #1683c5;
    font-weight: bold;
}

/* BUTTONS */

button {
    border: 1px solid #555;
    border-radius: 3px;
    background: linear-gradient(#65b5e8, #1683c5);
    color: white;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px #555;
}

button:hover {
    background: linear-gradient(#79c5ed, #1683c5);
}

button.gray {
    background: linear-gradient(#aaa, #777);
}

button.gray:hover {
    background: linear-gradient(#bbb, #888);
}

.full-button {
    width: 100%;
    margin-top: 8px;
}

/* MESSAGE */

#message {
    display: none;
    margin-top: 12px;
    background: white;
    border: 1px solid #aaa;
    padding: 10px;
    color: #1683c5;
    font-weight: bold;
}

/* FOOTER */

footer {
    max-width: 1000px;
    margin: 40px auto 0;
    padding: 15px 10px;
    border-top: 1px solid #aaa;
    color: #777;
}

footer a {
    color: #1683c5;
    text-decoration: none;
}

/* MOBILE */

@media (max-width: 700px) {

    .avatar-panel {
        grid-template-columns: 1fr;
    }

    .controls {
        border-left: 0;
        border-top: 1px solid #aaa;
    }

    .preview {
        min-height: 450px;
    }

}

@media (max-width: 500px) {

    .logo {
        text-align: center;
    }

    nav a {
        padding: 8px 9px;
        font-size: 12px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="header-inner">

        <div class="logo">
            MTB REVIVALS
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Account
            </a>

            <a href="avatar.html" class="active">
                Avatar
            </a>

            <a href="accessories.html">
                Accessories
            </a>

            <a href="clothes.html">
                Clothes
            </a>

            <a href="inventory.html">
                Inventory
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="news.html">
                News
            </a>

        </nav>

    </div>

</header>


<!-- MAIN -->

<div class="container">

    <div class="page-title">
        Avatar
    </div>


    <div id="message"></div>


    <div class="avatar-panel">


        <!-- AVATAR PREVIEW -->

        <div class="preview">

            <div class="preview-title">
                My Character
            </div>


            <div class="avatar" id="avatar">


                <!-- HAT -->

                <div
                    id="hat"
                    style="display:none;">

                    <div class="hat"></div>
                    <div class="hat-brim"></div>

                </div>


                <!-- HEAD -->

                <div class="head">

                    <div class="face"></div>

                    <div class="mouth"></div>

                </div>


                <!-- ARMS -->

                <div class="arm left"></div>

                <div class="arm right"></div>


                <!-- BODY -->

                <div
                    class="body"
                    id="body">
                </div>


                <!-- LEGS -->

                <div
                    class="leg left"
                    id="leftLeg">
                </div>

                <div
                    class="leg right"
                    id="rightLeg">
                </div>


                <!-- FEET -->

                <div class="foot left"></div>

                <div class="foot right"></div>

            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="controls-title">
                Equipped Items
            </div>


            <!-- SHIRT -->

            <div class="equipped-box">

                <div class="equipped-header">
                    Shirt
                </div>

                <div
                    class="equipped-content"
                    id="shirtName">

                    <span class="empty">
                        Nothing equipped
                    </span>

                </div>

            </div>


            <!-- PANTS -->

            <div class="equipped-box">

                <div class="equipped-header">
                    Pants
                </div>

                <div
                    class="equipped-content"
                    id="pantsName">

                    <span class="empty">
                        Nothing equipped
                    </span>

                </div>

            </div>


            <!-- ACCESSORY -->

            <div class="equipped-box">

                <div class="equipped-header">
                    Accessory
                </div>

                <div
                    class="equipped-content"
                    id="accessoryName">

                    <span class="empty">
                        Nothing equipped
                    </span>

                </div>

            </div>


            <button
                class="full-button"
                onclick="refreshAvatar()">

                Refresh Avatar

            </button>


            <button
                class="gray full-button"
                onclick="unequipAll()">

                Unequip All

            </button>


            <a href="inventory.html"
               style="text-decoration:none;">

                <button
                    class="gray full-button">

                    Open Inventory

                </button>

            </a>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    MTB REVIVALS © 2026

    &nbsp; | &nbsp;

    <a href="index.html">
        Home
    </a>

    &nbsp; | &nbsp;

    <a href="inventory.html">
        Inventory
    </a>

</footer>


<script>

/*
    MTB REVIVALS AVATAR SYSTEM

    Reads the equipment saved by inventory.html.
*/


function getEquipped() {

    return JSON.parse(
        localStorage.getItem("mtbEquipped")
    ) || {

        Shirt: null,
        Pants: null,
        Accessory: null

    };

}


/* LOAD AVATAR */

function refreshAvatar() {

    const equipped =
        getEquipped();


    /*
        SHIRT
    */

    const shirtName =
        document.getElementById("shirtName");


    if (equipped.Shirt) {

        shirtName.innerHTML =
            '<span class="item-name">' +
            equipped.Shirt +
            '</span>';

        document
            .getElementById("body")
            .style.background = "#1683ff";

        document
            .querySelector(".arm.left")
            .style.background = "#1683ff";

        document
            .querySelector(".arm.right")
            .style.background = "#1683ff";

    } else {

        shirtName.innerHTML =
            '<span class="empty">Nothing equipped</span>';

        document
            .getElementById("body")
            .style.background = "#1683ff";

        document
            .querySelector(".arm.left")
            .style.background = "#f2c29b";

        document
            .querySelector(".arm.right")
            .style.background = "#f2c29b";

    }


    /*
        PANTS
    */

    const pantsName =
        document.getElementById("pantsName");


    if (equipped.Pants) {

        pantsName.innerHTML =
            '<span class="item-name">' +
            equipped.Pants +
            '</span>';

        document
            .getElementById("leftLeg")
            .style.background = "#333";

        document
            .getElementById("rightLeg")
            .style.background = "#333";

    } else {

        pantsName.innerHTML =
            '<span class="empty">Nothing equipped</span>';

        document
            .getElementById("leftLeg")
            .style.background = "#777";

        document
            .getElementById("rightLeg")
            .style.background = "#777";

    }


    /*
        ACCESSORY
    */

    const accessoryName =
        document.getElementById("accessoryName");

    const hat =
        document.getElementById("hat");


    if (equipped.Accessory) {

        accessoryName.innerHTML =
            '<span class="item-name">' +
            equipped.Accessory +
            '</span>';

        hat.style.display = "block";


        /*
            Change accessory appearance
        */

        const hatPart =
            document.querySelector(".hat");

        const brimPart =
            document.querySelector(".hat-brim");


        if (
            equipped.Accessory
            .toLowerCase()
            .includes("red")
        ) {

            hatPart.style.background = "#d83232";
            brimPart.style.background = "#d83232";

        }

        else if (
            equipped.Accessory
            .toLowerCase()
            .includes("green")
        ) {

            hatPart.style.background = "#22aa55";
            brimPart.style.background = "#22aa55";

        }

        else if (
            equipped.Accessory
            .toLowerCase()
            .includes("fedora")
        ) {

            hatPart.style.background = "#222";
            brimPart.style.background = "#222";

        }

        else if (
            equipped.Accessory
            .toLowerCase()
            .includes("crown")
        ) {

            hatPart.style.background = "#e6b800";
            brimPart.style.background = "#e6b800";

        }

        else {

            hatPart.style.background = "#1683c5";
            brimPart.style.background = "#1683c5";

        }

    } else {

        accessoryName.innerHTML =
            '<span class="empty">Nothing equipped</span>';

        hat.style.display = "none";

    }


    showMessage("Avatar updated!");

}


/* UNEQUIP EVERYTHING */

function unequipAll() {

    const emptyEquipment = {

        Shirt: null,
        Pants: null,
        Accessory: null

    };


    localStorage.setItem(
        "mtbEquipped",
        JSON.stringify(emptyEquipment)
    );


    refreshAvatar();

    showMessage("All items unequipped!");

}


/* MESSAGE */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.style.display =
        "block";


    setTimeout(function() {

        message.style.display =
            "none";

    }, 2000);

}


/* START */

refreshAvatar();


/*
    Automatically refresh if another
    page changes localStorage.
*/

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key === "mtbEquipped"
        ) {

            refreshAvatar();

        }

    }
);

</script>

</body>

</html>
