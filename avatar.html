<!DOCTYPE html>

<head>

<title>MTB REVIVALS - Avatar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;

}

header {

}

.logo {

}

nav {

.title {

}

.avatar-box {
    margin-top: 15px;

    border: 1px solid #aaa;
    min-height: 520px;
    display: flex;
    justify-content: center;

    overflow: hidden;
}

.avatar {
    position: relative;
    width: 280px;
    height: 460px;
}

/* =========================
   HEAD
========================= */

.head {
    position: absolute;
    width: 110px;
    height: 110px;
    left: 85px;
    top: 75px;
    background: #f2c29b;
    border: 3px solid #555;
    border-radius: 4px;
    z-index: 5;
}

/* =========================
   FACE
========================= */

.face {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.eye {
    position: absolute;
    width: 10px;
    height: 14px;
    top: 38px;
    background: #222;
    border-radius: 2px;
}

.eye-left {
    left: 27px;
}

.eye-right {
    right: 27px;
}

.smile {
    position: absolute;
    width: 38px;
    height: 18px;
    left: 33px;
    top: 65px;
    border-bottom: 4px solid #222;
    border-radius: 50%;
}

/* Face styles */

.face-big-smile .smile {
    width: 48px;
    height: 25px;
    left: 28px;
    border-bottom-width: 7px;
}

.face-neutral .smile {
    width: 35px;
    height: 0;
    top: 76px;
    border-radius: 0;
}

.face-sad .smile {
    top: 78px;
    border: 0;
    border-top: 4px solid #222;
}

.face-surprised .smile,
.face-shocked .smile {
    width: 20px;
    height: 25px;
    left: 45px;
    top: 68px;
    border: 4px solid #222;
    border-radius: 50%;
}

.face-angry .eye-left {
    transform: rotate(25deg);
}

.face-angry .eye-right {
    transform: rotate(-25deg);
}

.face-angry .smile {
    top: 78px;
    border: 0;
    border-top: 4px solid #222;
}

.face-sleepy .eye {
    height: 3px;
    top: 44px;
    border-radius: 5px;
}

.face-wink .eye-right {
    height: 3px;
    top: 44px;
    border-radius: 5px;
}

.face-silly .eye-left {
    transform: rotate(15deg);
}

.face-silly .eye-right {
    transform: rotate(-15deg);
}

.face-evil .eye {
    background: #a00;
    box-shadow: 0 0 5px red;
}

.face-evil .smile {
    border: 0;
    border-top: 4px solid #222;
}

.face-cool .eye {
    width: 28px;
    height: 10px;
    top: 38px;
    background: #111;
}

.face-cool .eye-left {
    left: 15px;
}

.face-cool .eye-right {
    right: 15px;
}

.face-nerd .eye {
    width: 20px;
    height: 20px;
    top: 34px;
    background: transparent;
    border: 3px solid #222;
    border-radius: 50%;
}

.face-nerd .eye-left {
    left: 18px;
}

.face-nerd .eye-right {
    right: 18px;
}

.face-scared .eye {
    width: 18px;
    height: 20px;
    border-radius: 50%;
}

.face-scared .eye-left {
    left: 20px;
}

.face-scared .eye-right {
    right: 20px;
}

.face-proud .eye {
    height: 7px;
}

/* =========================
   BODY
========================= */

.body {
    position: absolute;
    width: 125px;
    height: 135px;
    left: 77px;
    top: 185px;
    background: #1683ff;
    border: 3px solid #555;
    z-index: 2;
}

/* =========================
   SHIRT GRAPHICS
========================= */

.shirt-logo {
    position: absolute;
    left: 0;
    width: 100%;
    top: 48px;
    text-align: center;
    color: white;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 2px 2px #111;
    z-index: 4;
}

.shirt-star {
    position: absolute;
    width: 55px;
    height: 55px;
    left: 32px;
    top: 35px;
    background: white;
    clip-path: polygon(
        50% 0,
        61% 35%,
        100% 35%,
        69% 58%,
        81% 100%,
        50% 74%,
        19% 100%,
        31% 58%,
        0 35%,
        39% 35%
    );
    z-index: 3;
}

.shirt-flame {
    position: absolute;
    width: 100%;
    top: 38px;
    text-align: center;
    font-size: 45px;
    z-index: 4;
}

.shirt-lightning {
    position: absolute;
    width: 100%;
    top: 30px;
    text-align: center;
    font-size: 55px;
    color: white;
    text-shadow: 0 0 8px #6bd8ff;
    z-index: 4;
}

/* =========================
   ARMS
========================= */

.arm {
    position: absolute;
    width: 45px;
    height: 130px;
    top: 188px;
    background: #f2c29b;
    border: 3px solid #555;
    z-index: 1;
}

.arm-left {
    left: 30px;
}

.arm-right {
    right: 30px;
}

/* =========================
   LEGS
========================= */

.leg {
    position: absolute;
    width: 55px;
    height: 125px;
    top: 320px;
    background: #333;
    border: 3px solid #555;
    z-index: 1;
}

.leg-left {
    left: 78px;
}

.leg-right {
    right: 78px;
}

/* =========================
   PANTS GRAPHICS
========================= */

.pants-logo {
    position: absolute;
    width: 100%;
    top: 45px;
    text-align: center;
    font-size: 12px;
    font-weight: 900;
    color: white;
    text-shadow: 1px 1px #111;
}

.pants-star {
    position: absolute;
    width: 35px;
    height: 35px;
    left: 7px;
    top: 35px;
    background: white;
    clip-path: polygon(
        50% 0,
        61% 35%,
        100% 35%,
        69% 58%,
        81% 100%,
        50% 74%,
        19% 100%,
        31% 58%,
        0 35%,
        39% 35%
    );
}

.pants-flame {
    position: absolute;
    width: 100%;
    top: 35px;
    text-align: center;
    font-size: 28px;
}

.pants-lightning {
    position: absolute;
    width: 100%;
    top: 25px;
    text-align: center;
    font-size: 35px;
    color: white;
    text-shadow: 0 0 5px #6bd8ff;
}

/* ALL SEASONS */

.season-pants {
    animation: seasonColors 12s infinite;
}

@keyframes seasonColors {

    0%,24% {
        background:
            linear-gradient(
                90deg,
                #67d477,
                #f2a5d4
            );
    }

    25%,49% {
        background:
            linear-gradient(
                90deg,
                #18bde9,
                #f4df54
            );
    }

    50%,74% {
        background:

                #df7a1d
            );
    }

    75%,100% {
        background:
            linear-gradient(
                90deg,
                #69d8ff,
                #eafaff
            );
    }
}

/* =========================
   ACCESSORIES
========================= */

.fedora {
    position: absolute;
    width: 150px;
    height: 70px;
    left: 65px;
    top: 28px;
    border-radius: 50% 50% 20% 20%;
    border: 3px solid rgba(0,0,0,.35);

}

.fedora::before {
    content: "";
    position: absolute;
    width: 185px;
    height: 18px;
    left: -20px;
    bottom: -7px;
    background: inherit;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,.35);
}

.fedora.classic {
    background: linear-gradient(135deg,#eee,#999,#fff);
}

.fedora.red {
    background: linear-gradient(135deg,#ff7777,#b91515,#ffaaaa);
}

.fedora.blue {
    background: linear-gradient(135deg,#7edcff,#0876c9,#bceeff);
}

.fedora.gold {
    background: linear-gradient(135deg,#fff3a0,#d7a400,#fff7c7);
}

.fedora.purple {
    background: linear-gradient(135deg,#db9cff,#7420b5,#f0c9ff);
}

.fedora.pink {
    background: linear-gradient(135deg,#ff9edb,#d52c8a,#ffd2ef);
}

.fedora.rainbow {
    background:
        linear-gradient(
            120deg,
            #ff3b3b,
            #ffb52e,
            #fff238,
            #39d86a,
            #35bfff,
            #7c4dff,
            #ff54c8
        );
}

.horns {
    position: absolute;
    width: 180px;
    height: 120px;
    left: 50px;
    top: 5px;
    z-index: 18;
}

.horn {
    position: absolute;
    width: 38px;
    height: 105px;
    background:
        linear-gradient(
            135deg,
            #fff,
            #8eeaff,
            #277cae
        );
    border: 3px solid #377f9c;
    box-shadow: 0 0 14px #69eaff;
    border-radius: 75% 25% 20% 20%;
}

.horn.left {
    left: 20px;
    transform: rotate(-28deg);
}

.horn.right {
    right: 20px;
    transform: rotate(28deg) scaleX(-1);
}

.crown {
    position: absolute;
    width: 125px;
    height: 80px;
    left: 77px;
    top: 35px;
    z-index: 15;
    background:
        linear-gradient(#fff47b,#d39d00);
    clip-path:
        polygon(
            0 100%,
            10% 20%,
            30% 55%,
            50% 0,
            70% 55%,
            90% 20%,
            100% 100%
        );
}

.wings {
    position: absolute;
    width: 280px;
    height: 150px;
    left: 0;
    top: 205px;
    z-index: 0;
}

.wings::before,
.wings::after {
    content: "";
    position: absolute;
    width: 105px;

    background:
        linear-gradient(
            135deg,

            #a8dfff,
            #559cc5
        );
    border: 3px solid #6095ad;
    border-radius: 80% 20% 80% 20%;
}

.wings::before {
    left: 0;
    transform: rotate(-20deg);
}

.wings::after {
    right: 0;
    transform: rotate(20deg) scaleX(-1);
}

/* =========================
   CONTROLS
========================= */

.status {
    margin-top: 15px;
    background: white;

    padding: 12px;

}

.controls {
    margin-top: 10px;

button {
    padding: 9px 15px;

}

button:hover {
    background:
        linear-gradient(#82c9ef,#1683c5);
}

@media(max-width:600px) {

    .logo {
        text-align: center;
    }

    nav a {
        padding: 8px 9px;

    }

        transform: scale(.85);
    }

</style>

<script>

/* =========================
   FACE
========================= */

const faceNames = {

    happy: "Classic Smile",
    "big-smile": "Big Smile",
    neutral: "Neutral",
    sad: "Sad",
    surprised: "Surprised",
    angry: "Angry",
    sleepy: "Sleepy",
    wink: "Wink",
    silly: "Silly",
    evil: "Evil",
    cool: "Cool",
    shocked: "Shocked",
    nerd: "Nerd",
    laugh: "Laugh",
    confused: "Confused",
    scared: "Scared",
    proud: "Proud"

};


function loadFace() {

    const saved =
        localStorage.getItem("mtbFace")
        || "happy";

    document
        .getElementById("face")
        .className =
        "face face-" + saved;

}


/* =========================
   SHIRT
========================= */

function loadShirt() {

    const shirt =
        localStorage.getItem("mtbShirt");

    const body =
        document.getElementById(
            "shirtGraphic"
        );


    body.innerHTML = "";

    if (!shirt) {
        return;
    }


    /*
       Make the body color
       match the clothing.
    */

    const avatarBody =
        document.querySelector(".body");


    avatarBody.style.background =
        "#111";


    if (
        shirt ===
        "MTB Classic Logo"
    ) {

        body.innerHTML =
            `<div class="shirt-logo">MTB</div>`;

    }

    else if (
        shirt ===
        "MTB Star Streetwear"
        ||
        shirt ===
        "Midnight Star"
    ) {

        body.innerHTML = `
            <div class="shirt-star"></div>
            <div class="shirt-logo"
                 style="font-size:18px;top:102px;">
                 MTB
            </div>
        `;

    }

    else if (
        shirt ===
        "MTB Flame"
    ) {

        avatarBody.style.background =
            "#8b1111";

        body.innerHTML =
            `<div class="shirt-flame">🔥</div>`;

    }

    else if (
        shirt ===
        "MTB Lightning"
    ) {

        avatarBody.style.background =
            "#07558c";

        body.innerHTML =
            `<div class="shirt-lightning">⚡</div>`;

    }

    else if (
        shirt ===
        "MTB Grey Essential"
    ) {

        avatarBody.style.background =
            "#555";

        body.innerHTML =
            `<div class="shirt-logo">MTB</div>`;

    }

    else if (
        shirt ===
        "MTB Gothic"
    ) {

        body.innerHTML = `
            <div class="shirt-logo"
                 style="
                 font-size:20px;
                 letter-spacing:4px;">
                 MTB
            </div>
        `;

    }

    else if (
        shirt ===
        "MTB White Classic"
    ) {

        avatarBody.style.background =
            "#eee";

        body.innerHTML = `
            <div class="shirt-logo"
                 style="
                 color:#111;
                 text-shadow:1px 1px #aaa;">
                 MTB
            </div>
        `;

    }

    else if (
        shirt ===
        "Midnight Cross"
    ) {

        body.innerHTML = `
            <div class="shirt-logo"
                 style="font-size:45px;">
                 ✚
            </div>
        `;

    }

}


/* =========================
   PANTS
========================= */

function loadPants() {

    const pants =
        localStorage.getItem(
            "mtbPants"
        );


    const left =
        document.querySelector(
            ".leg-left"
        );

    const right =
        document.querySelector(
            ".leg-right"
        );


    left.innerHTML = "";
    right.innerHTML = "";


    left.className =
        "leg leg-left";

    right.className =
        "leg leg-right";


    if (!pants) {
        return;
    }


    if (
        pants ===
        "MTB Black Logo Pants"
    ) {

        left.innerHTML =
            `<div class="pants-logo">MTB</div>`;

        right.innerHTML =
            `<div class="pants-logo">MTB</div>`;

    }

    else if (
        pants ===
        "MTB Grey Classic Pants"
    ) {

        left.style.background =
            "#555";

        right.style.background =
            "#555";

        left.innerHTML =
            `<div class="pants-logo">MTB</div>`;

        right.innerHTML =
            `<div class="pants-logo">MTB</div>`;

    }

    else if (
        pants ===
        "MTB Star Pants"
    ) {

        left.innerHTML =
            `<div class="pants-star"></div>`;

        right.innerHTML =
            `<div class="pants-star"></div>`;

    }

    else if (
        pants ===
        "MTB Flame Pants"
    ) {

        left.style.background =
            "#8b1111";

        right.style.background =
            "#8b1111";

        left.innerHTML =
            `<div class="pants-flame">🔥</div>`;

        right.innerHTML =
            `<div class="pants-flame">🔥</div>`;

    }

    else if (
        pants ===
        "MTB Lightning Pants"
    ) {

        left.style.background =
            "#07558c";

        right.style.background =
            "#07558c";

        left.innerHTML =
            `<div class="pants-lightning">⚡</div>`;

        right.innerHTML =
            `<div class="pants-lightning">⚡</div>`;

    }

    else if (
        pants ===
        "MTB Midnight Pants"
    ) {

        left.style.background =
            "#111";

        right.style.background =
            "#111";

        left.innerHTML =
            `<div class="pants-logo">MTB</div>`;

        right.innerHTML =
            `<div class="pants-logo">MIDNIGHT</div>`;

    }

    else if (
        pants ===
        "MTB Classic Jeans"
    ) {

        left.style.background =
            "#2166a5";

        right.style.background =
            "#2166a5";

        left.innerHTML =
            `<div class="pants-logo">MTB</div>`;

        right.innerHTML =
            `<div class="pants-logo">MTB</div>`;

    }

    else if (
        pants ===
        "MTB All Seasons Pants"
    ) {

        left.classList.add(
            "season-pants"
        );

        right.classList.add(
            "season-pants"
        );

    }

}


/* =========================
   ACCESSORY
========================= */

function loadAccessory() {

    const item =
        localStorage.getItem(
            "mtbAccessory"
        );

    const accessory =
        document.getElementById(
            "accessory"
        );


    accessory.innerHTML = "";


    if (!item) {
        return;
    }


    const colors = {

        "Sparkle Fedora":
            "classic",

        "Sparkle Fedora - Red":
            "red",

        "Sparkle Fedora - Blue":
            "blue",

        "Sparkle Fedora - Gold":
            "gold",

        "Sparkle Fedora - Purple":
            "purple",

        "Sparkle Fedora - Pink":
            "pink",

        "Sparkle Fedora - Rainbow":
            "rainbow"

    };


    if (colors[item]) {

        accessory.innerHTML =
            `<div class="fedora ${colors[item]}"></div>`;

    }

    else if (
        item ===
        "Frozen Crystal Horns"
    ) {

        accessory.innerHTML = `
            <div class="horns">
                <div class="horn left"></div>
                <div class="horn right"></div>
            </div>
        `;

    }

    else if (
        item ===
        "Royal Crown"
    ) {

        accessory.innerHTML =
            `<div class="crown"></div>`;

    }

    else if (
        item ===
        "Crystal Wings"
    ) {

        accessory.innerHTML =
            `<div class="wings"></div>`;

    }

}


/* =========================
   REMOVE
========================= */

function removeShirt() {

    localStorage.removeItem(
        "mtbShirt"
    );

    loadShirt();

}


function removePants() {

    localStorage.removeItem(
        "mtbPants"
    );

    loadPants();

}


function removeAccessory() {

    localStorage.removeItem(
        "mtbAccessory"
    );

    loadAccessory();

}


/* =========================
   STATUS
========================= */

function updateStatus() {

    const shirt =
        localStorage.getItem(
            "mtbShirt"
        );

    const pants =
        localStorage.getItem(
            "mtbPants"
        );

    const face =
        localStorage.getItem(
            "mtbFace"
        ) || "happy";

    let message =
        faceNames[face] +
        " equipped";


    if (shirt) {
        message +=
            " • " + shirt;
    }

    if (pants) {
        message +=
            " • " + pants;
    }


    document
        .getElementById("status")
        .textContent =
        message;

}


/* =========================
   START
========================= */

loadFace();
loadShirt();
loadPants();
loadAccessory();
updateStatus();


/*
   Refresh avatar when another
   MTB page changes localStorage.
*/

window.addEventListener(
