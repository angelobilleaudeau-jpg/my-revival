<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MTB REVIVALS - Avatar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    color: #222;
}

/* HEADER */

header {
    background: #333;
    color: white;
    padding: 15px;
}

.header {
    max-width: 1050px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.user {
    background: #222;
    padding: 8px 12px;
    border-radius: 5px;
}

/* NAV */

nav {
    background: #444;
    overflow-x: auto;
    white-space: nowrap;
}

nav a {
    display: inline-block;
    color: white;
    text-decoration: none;
    padding: 13px 15px;
}

nav a:hover {
    background: #222;
}

/* MAIN */

.container {
    max-width: 1050px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-top: 0;
}

/* AVATAR */

.avatar-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* AVATAR DISPLAY */

.avatar-box {
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
}

.avatar {
    width: 240px;
    height: 360px;

    margin: auto;

    position: relative;

    background: #eee;

    border-radius: 8px;

    overflow: hidden;
}

/* AVATAR BODY */

.head {
    position: absolute;

    width: 95px;
    height: 95px;

    background: #f0b27a;

    border-radius: 8px;

    top: 35px;
    left: 72px;

    z-index: 3;
}

.body {
    position: absolute;

    width: 120px;
    height: 120px;

    background: #1683ff;

    top: 125px;
    left: 60px;

    border-radius: 5px;

    z-index: 2;
}

.arm-left,
.arm-right {
    position: absolute;

    width: 45px;
    height: 115px;

    background: #f0b27a;

    top: 130px;

    border-radius: 5px;

    z-index: 1;
}

.arm-left {
    left: 15px;
}

.arm-right {
    right: 15px;
}

.leg-left,
.leg-right {
    position: absolute;

    width: 55px;
    height: 110px;

    background: #315a9b;

    top: 245px;

    border-radius: 4px;
}

.leg-left {
    left: 62px;
}

.leg-right {
    right: 62px;
}

/* FACE */

.face {
    position: absolute;

    top: 60px;
    left: 92px;

    font-size: 45px;

    z-index: 4;
}

/* ACCESSORY */

.accessory {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;

    text-align: center;

    font-size: 65px;

    z-index: 5;

    pointer-events: none;
}

/* CONTROLS */

.controls {
    margin-top: 20px;
}

.controls button {
    margin: 4px;

    padding: 9px 13px;

    border: 1px solid #aaa;

    border-radius: 5px;

    background: white;

    cursor: pointer;
}

.controls button:hover {
    background: #ddd;
}

/* INVENTORY */

.inventory-box {
    background: white;

    border: 1px solid #ccc;

    border-radius: 8px;

    padding: 20px;
}

.inventory-item {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 12px;

    border-bottom: 1px solid #ddd;
}

.inventory-item:last-child {
    border-bottom: none;
}

.inventory-item button {
    background: #1683ff;

    color: white;

    border: none;

    padding: 8px 12px;

    border-radius: 5px;

    cursor: pointer;
}

.remove {
    background: #d33 !important;
}

/* LOGIN */

.login {
    background: white;

    border: 1px solid #ccc;

    padding: 25px;

    border-radius: 8px;

    text-align: center;
}

.login a {
    display: inline-block;

    margin-top: 10px;

    background: #1683ff;

    color: white;

    text-decoration: none;

    padding: 10px 18px;

    border-radius: 5px;
}

/* MOBILE */

@media(max-width:700px) {

    .avatar-section {
        grid-template-columns: 1fr;
    }

    .avatar {
        width: 220px;
        height: 340px;
    }

}

</style>

</head>


<body>


<header>

<div class="header">

<div class="logo">
MTB REVIVALS
</div>

<div class="user">

👤 <span id="username">
Guest
</span>

</div>

</div>

</header>


<nav>

<a href="index.html">
Home
</a>

<a href="login.html">
Account
</a>

<a href="avatar.html">
Avatar
</a>

<a href="accessories.html">
Accessories
</a>

<a href="clothes.html">
Clothes
</a>

<a href="inventory.html">
Inventory
</a>

<a href="games.html">
Games
</a>

<a href="news.html">
News
</a>

</nav>


<div class="container">


<!-- LOGIN -->

<div
id="loginBox"
class="login"
style="display:none;"
>

<h2>
🔐 Login Required
</h2>

<p>
You need an account to customize your avatar.
</p>

<a href="login.html">
Login / Sign Up
</a>

</div>


<!-- AVATAR -->

<div
id="avatarPage"
style="display:none;"
>

<h1>
🧑 My Avatar
</h1>


<div class="avatar-section">


<!-- AVATAR PREVIEW -->

<div class="avatar-box">

<h2>
Avatar Preview
</h2>


<div class="avatar">

<div
id="accessory"
class="accessory">
</div>


<div class="head">

<div
id="face"
class="face">
🙂
</div>

</div>


<div class="body">
</div>


<div class="arm-left">
</div>

<div class="arm-right">
</div>


<div class="leg-left">
</div>

<div class="leg-right">
</div>

</div>


<div class="controls">

<button onclick="removeAccessory()">
Remove Accessory
</button>

</div>


<p>
Equipped:
<strong id="equippedName">
Nothing
</strong>
</p>

</div>


<!-- INVENTORY -->

<div class="inventory-box">

<h2>
📦 Accessories
</h2>

<div id="inventory">
</div>

</div>


</div>

</div>

</div>


<script>

/*
==================================================
MTB REVIVALS AVATAR
==================================================

This is an original 2D avatar preview.

It uses the same localStorage account system
as login.html and accessories.html.

==================================================
*/


/* ITEM DATABASE */

const items = [

{
id: 101,
name: "Frozen Horns",
icon: "❄️"
},

{
id: 102,
name: "Shadowless Head",
icon: "💀"
},

{
id: 103,
name: "Void Walker Leg",
icon: "🦵"
},

{
id: 104,
name: "Classic Crown",
icon: "👑"
},

{
id: 105,
name: "Classic Fedora",
icon: "🎩"
},

{
id: 106,
name: "Golden Wings",
icon: "🪽"
},

{
id: 107,
name: "Classic Smile",
icon: "🙂"
},

{
id: 108,
name: "Blue Headphones",
icon: "🎧"
},

{
id: 109,
name: "Ice Backpack",
icon: "🎒"
}

];


/* USER */

const username =
localStorage.getItem(
"mtbLoggedIn"
);


/* ACCOUNTS */

function getAccounts() {

return JSON.parse(
localStorage.getItem(
"mtbAccounts"
)
) || {};

}


/* SAVE */

function saveAccounts(accounts) {

localStorage.setItem(
"mtbAccounts",
JSON.stringify(accounts)
);

}


/* CHECK LOGIN */

if(!username) {

document.getElementById(
"loginBox"
).style.display = "block";

} else {

document.getElementById(
"avatarPage"
).style.display = "block";

loadAvatar();

}


/* LOAD AVATAR */

function loadAvatar() {

const accounts =
getAccounts();

const account =
accounts[username];


if(!account) {

localStorage.removeItem(
"mtbLoggedIn"
);

location.reload();

return;

}


document.getElementById(
"username"
).textContent =
account.username;


if(!account.inventory) {

account.inventory = [];

}


displayInventory();


/* LOAD EQUIPPED ITEM */

const equipped =
account.equipped;


if(equipped) {

equipItem(equipped);

}

}


/* INVENTORY */

function displayInventory() {

const accounts =
getAccounts();

const account =
accounts[username];

const container =
document.getElementById(
"inventory"
);


container.innerHTML = "";


if(
!account.inventory ||
account.inventory.length === 0
) {

container.innerHTML =
"<p>You don't own any accessories yet.</p>";

return;

}


account.inventory.forEach(
id => {

const item =
items.find(
i => i.id === id
);


if(!item) return;


const row =
document.createElement(
"div"
);


row.className =
"inventory-item";


row.innerHTML = `

<span>

${item.icon}

${item.name}

</span>

<button
onclick="equipItem(${item.id})"
>

Equip

</button>

`;


container.appendChild(
row
);

});

}


/* EQUIP */

function equipItem(id) {

const accounts =
getAccounts();

const account =
accounts[username];


if(
!account.inventory.includes(id)
) {

return;

}


/* SAVE */

account.equipped =
id;

saveAccounts(accounts);


/* FIND ITEM */

const item =
items.find(
i => i.id === id
);


if(!item) return;


/* DISPLAY */

document.getElementById(
"accessory"
).textContent =
item.icon;


document.getElementById(
"equippedName"
).textContent =
item.name;


/* SPECIAL ITEMS */


/* Headless-style */

if(id === 102) {

document.querySelector(
".head"
).style.background =
"transparent";

document.getElementById(
"face"
).style.display =
"none";

} else {

document.querySelector(
".head"
).style.background =
"#f0b27a";

document.getElementById(
"face"
).style.display =
"block";

}

}


/* REMOVE */

function removeAccessory() {

const accounts =
getAccounts();

const account =
accounts[username];


account.equipped =
null;


saveAccounts(
accounts
);


document.getElementById(
"accessory"
).textContent =
"";


document.getElementById(
"equippedName"
).textContent =
"Nothing";


document.querySelector(
".head"
).style.background =
"#f0b27a";


document.getElementById(
"face"
).style.display =
"block";

}

</script>

</body>

</html>
