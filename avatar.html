<meta charset="UTF-8">

<title>MTB REVIVALS - Avatar</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    background: #e8e8e8;
    color: #333;
}

/* TOP BAR */

header {
    background: linear-gradient(#f7f7f7, #d1d1d1);
    border-bottom: 1px solid #999;
    box-shadow: 0 1px 3px #aaa;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 8px 10px 0;
}

/* LOGO */

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #333;
    padding: 5px 0 10px;
}

/* NAVIGATION */

nav {
    display: flex;
    flex-wrap: wrap;
}

nav a {
    display: block;
    padding: 9px 13px;
    color: #444;
    text-decoration: none;
    border: 1px solid transparent;
    border-bottom: 0;
}

nav a:hover {
    background: #ddd;
}

nav a.active {
    background: white;
    border: 1px solid #aaa;
    border-bottom: 1px solid white;
    color: #1683c5;
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 10px;
}

/* PAGE TITLE */

.page-title {
    background: linear-gradient(#666, #444);
    color: white;
    padding: 9px 12px;
    border: 1px solid #333;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px #222;
}

/* CONTENT */

.content {
    display: grid;
    grid-template-columns: 430px 1fr;
    gap: 15px;
    margin-top: 15px;
}

/* BOX */

.box {
    background: white;
    border: 1px solid #aaa;
    box-shadow: 0 1px 2px #ccc;
}

.box-title {
    background: linear-gradient(#f5f5f5, #d7d7d7);
    border-bottom: 1px solid #aaa;
    padding: 8px 10px;
    font-weight: bold;
    color: #444;
}

/* AVATAR */

.preview {
    min-height: 450px;
    text-align: center;
    padding: 20px;
}

.username {
    font-size: 16px;
    font-weight: bold;
    color: #1683c5;
    margin-top: 10px;
}

/* BLOCK AVATAR */

.avatar {
    width: 220px;
    height: 330px;
    position: relative;
    margin: 10px auto 0;
}

/* HEAD */

.head {
    position: absolute;
    width: 90px;
    height: 90px;
    left: 65px;
    top: 5px;
    background: #f2c29b;
    border: 2px solid #555;
}

/* FACE */

.eye {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #222;
    top: 42px;
}

.eye.left {
    left: 25px;
}

.eye.right {
    right: 25px;
}

/* HAIR */

.hair {
    position: absolute;
    left: -2px;
    top: -2px;
    width: 90px;
    height: 25px;
    background: #222;
}

/* BODY */

.body {
    position: absolute;
    width: 100px;
    height: 115px;
    left: 60px;
    top: 97px;
    background: #1683ff;
    border: 2px solid #555;
}

/* ARMS */

.arm {
    position: absolute;
    width: 35px;
    height: 110px;
    top: 100px;
    background: #f2c29b;
    border: 2px solid #555;
}

.arm.left {
    left: 22px;
}

.arm.right {
    right: 22px;
}

/* LEGS */

.leg {
    position: absolute;
    width: 43px;
    height: 100px;
    top: 210px;
    background: #333;
    border: 2px solid #444;
}

.leg.left {
    left: 61px;
}

.leg.right {
    right: 61px;
}

/* CUSTOMIZATION */

.customize {
    padding-bottom: 15px;
}

.option {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

.option label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

select {
    width: 100%;
    height: 32px;
    border: 1px solid #999;
    background: white;
    font-size: 13px;
}

/* BUTTONS */

.buttons {
    padding: 12px;
}

button {
    border: 1px solid #555;
    border-radius: 3px;
    background: linear-gradient(#65b5e8, #1683c5);
    color: white;
    padding: 7px 16px;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px #555;
    box-shadow: inset 0 1px rgba(255,255,255,.4);
}

button:hover {
    background: linear-gradient(#79c5ed, #1683c5);
}

button.reset {
    background: linear-gradient(#aaa, #777);
    margin-left: 5px;
}

button.reset:hover {
    background: linear-gradient(#bbb, #888);
}

/* MESSAGE */

#message {
    margin-top: 10px;
    font-weight: bold;
    color: #1683c5;
}

/* NOT LOGGED IN */

.login-box {
    background: white;
    border: 1px solid #aaa;
    padding: 30px;
    text-align: center;
}

.login-box a {
    color: #1683c5;
    font-weight: bold;
}

/* FOOTER */

footer {
    max-width: 1000px;
    margin: 40px auto 0;
    padding: 15px 10px;
    border-top: 1px solid #aaa;
    color: #777;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 700px) {

    .content {
        grid-template-columns: 1fr;
    }

    nav a {
        padding: 8px 9px;
        font-size: 12px;
    }

    .logo {
        text-align: center;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            MTB REVIVALS
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="login.html">Account</a>

            <a href="avatar.html" class="active">
                Avatar
            </a>

            <a href="accessories.html">
                Accessories
            </a>

            <a href="clothes.html">
                Clothes
            </a>

            <a href="inventory.html">
                Inventory
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="news.html">
                News
            </a>

        </nav>

    </div>

</header>


<div class="container">

    <div class="page-title">
        Avatar
    </div>


    <!-- LOGIN WARNING -->

    <div id="notLoggedIn"
         class="login-box"
         style="display:none;">

        <h2>You need to log in.</h2>

        <p>
            Please log in to customize your avatar.
        </p>

        <a href="login.html">
            Go to Account
        </a>

    </div>


    <div id="avatarArea">

        <div class="content">

            <!-- AVATAR PREVIEW -->

            <div class="box preview">

                <div class="box-title">
                    Avatar Preview
                </div>

                <div class="avatar">

                    <div
                        class="head"
                        id="head">

                        <div
                            class="hair"
                            id="hair">
                        </div>

                        <div class="eye left"></div>
                        <div class="eye right"></div>

                    </div>


                    <div
                        class="body"
                        id="body">
                    </div>


                    <div
                        class="arm left">
                    </div>

                    <div
                        class="arm right">
                    </div>


                    <div
                        class="leg left">
                    </div>

                    <div
                        class="leg right">
                    </div>

                </div>

                <div
                    class="username"
                    id="username">
                </div>

            </div>


            <!-- CUSTOMIZATION -->

            <div class="box customize">

                <div class="box-title">
                    Customize Your Avatar
                </div>


                <div class="option">

                    <label>
                        Body Color
                    </label>

                    <select
                        id="skinColor"
                        onchange="updateAvatar()">

                        <option value="#f2c29b">
                            Light
                        </option>

                        <option value="#d99a6c">
                            Tan
                        </option>

                        <option value="#a96f45">
                            Brown
                        </option>

                        <option value="#70452b">
                            Dark
                        </option>

                    </select>

                </div>


                <div class="option">

                    <label>
                        Shirt

                    <select
                        id="shirtColor"
                        onchange="updateAvatar()">

                        <option value="#1683ff">
                            Blue
                        </option>

                        <option value="#ff3333">
                            Red
                        </option>

                        <option value="#22aa55">
                            Green
                        </option>

                        <option value="#8b45d6">
                            Purple
                        </option>

                        <option value="#222222">
                            Black
                        </option>

                        <option value="#eeeeee">
                            White
                        </option>

                    </select>

                </div>

                    <label>

                    <select

                        </option>

                            Blonde
                        </option>

                            White
                        </option>

                    </select>

                        Save Avatar
                    </button>

                        onclick="resetAvatar()">

                        Reset

            </div>

</div>

    <a href="news.html">
        News
    </a>

</footer>


<script>

/* CHECK ACCOUNT */

const loggedIn =
    localStorage.getItem("mtbLoggedIn");

const savedAccount =
    localStorage.getItem("mtbAccount");


if (
    loggedIn !== "true" ||
    !savedAccount
) {

    document
        .getElementById("avatarArea")
        .style.display = "none";

    document
        .getElementById("notLoggedIn")
        .style.display = "block";

} else {

    const account =
        JSON.parse(savedAccount);

    document
        .getElementById("username")
        .textContent =
        account.username;

}


/* UPDATE */

function updateAvatar() {

    const skin =
        document.getElementById("skinColor").value;

    const shirt =
        document.getElementById("shirtColor").value;

    const pants =
        document.getElementById("pantsColor").value;

    const hair =
        document.getElementById("hairColor").value;


    document
        .getElementById("head")
        .style.background = skin;


    document
        .querySelectorAll(".arm")
        .forEach(function(arm) {

            arm.style.background = skin;

        });


    document
        .getElementById("body")
        .style.background = shirt;


    document
        .querySelectorAll(".leg")
        .forEach(function(leg) {

            leg.style.background = pants;

        });


    document
        .getElementById("hair")
        .style.background = hair;

}


/* SAVE */

function saveAvatar() {

    const avatar = {

        skin:
            document.getElementById("skinColor").value,

        shirt:
            document.getElementById("shirtColor").value,

        pants:
            document.getElementById("pantsColor").value,

        hair:
            document.getElementById("hairColor").value

    };


    localStorage.setItem(
        "mtbAvatar",
        JSON.stringify(avatar)
    );


    document
        .getElementById("message")
        .textContent =
        "Avatar saved successfully!";

}


/* LOAD */

function loadAvatar() {

    const saved =
        localStorage.getItem("mtbAvatar");


    if (!saved) {

        updateAvatar();

        return;

    }


    const avatar =
        JSON.parse(saved);


    document
        .getElementById("skinColor")
        .value = avatar.skin;

    document
        .getElementById("shirtColor")
        .value = avatar.shirt;

    document
        .getElementById("pantsColor")
        .value = avatar.pants;

    document
        .getElementById("hairColor")
        .value = avatar.hair;


    updateAvatar();

}


/* RESET */

function resetAvatar() {

    localStorage.removeItem("mtbAvatar");


    document
        .getElementById("skinColor")
        .value = "#f2c29b";

    document
        .getElementById("shirtColor")
        .value = "#1683ff";

    document
        .getElementById("pantsColor")
        .value = "#333333";

    document
        .getElementById("hairColor")
        .value = "#222222";


    updateAvatar();


    document
        .getElementById("message")
        .textContent =
        "Avatar reset.";

}


loadAvatar();

</script>

</body>
</html>
